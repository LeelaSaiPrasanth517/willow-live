<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Cricketive | Match</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

.header {
    height: 70px;
    padding: 0 28px;
    display: flex;
    align-items: center;
    background: #090909;
    border-bottom: 1px solid #222;
}

.brand {
    display: flex;
    align-items: center;
}

.brand img {
    height: 48px;
    width: 48px;
    object-fit: cover;
    border-radius: 8px;
}

.brand span {
    font-weight: 800;
    font-size: 21px;
    margin-left: 9px;
}

.back {
    margin-left: auto;
    color: #fff;
    text-decoration: none;
    background: #222;
    padding: 9px 13px;
    border-radius: 7px;
    font-size: 13px;
}

.wrap {
    max-width: 1050px;
    margin: auto;
    padding: 28px 15px 50px;
}


/* =========================================================
   MATCH HEADER
   ========================================================= */

.match-head {
    background: #101010;
    border: 1px solid #252525;
    border-radius: 12px;
    padding: 20px;
}

.title {
    font-size: 24px;
    font-weight: 800;
}

.meta {
    color: #999;
    font-size: 13px;
    line-height: 1.6;
    margin-top: 8px;
}

.live-badge {
    display: inline-block;
    margin-top: 12px;
    padding: 6px 10px;
    border-radius: 20px;
    background: #3a1010;
    color: #ff6666;
    font-size: 11px;
    font-weight: 700;
}

.upcoming-badge {
    display: inline-block;
    margin-top: 12px;
    padding: 6px 10px;
    border-radius: 20px;
    background: #1e2b39;
    color: #8fc7ff;
    font-size: 11px;
    font-weight: 700;
}


/* =========================================================
   PLAYER
   ========================================================= */

.player {
    display: none;
    margin-top: 20px;
    background: #000;
    border: 1px solid #252525;
    border-radius: 12px;
    overflow: hidden;
}

.player-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    background: #0b0b0b;
    border-bottom: 1px solid #222;
}

.player-title {
    font-size: 13px;
    font-weight: 700;
}

.close-player {
    border: 0;
    background: #222;
    color: #fff;
    padding: 6px 9px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
}

.player iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 0;
    display: block;
    background: #000;
}


/* =========================================================
   STREAM SECTION
   ========================================================= */

.streams {
    margin-top: 24px;
}

.streams h2 {
    margin: 0 0 12px;
    font-size: 21px;
}

.stream {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: #101010;
    border: 1px solid #252525;
    border-radius: 9px;
    padding: 14px;
    margin-top: 9px;
}

.stream-info {
    min-width: 0;
}

.stream-language {
    font-weight: 700;
    font-size: 14px;
}

.stream-name {
    color: #999;
    font-size: 12px;
    margin-top: 4px;
}

.watch {
    border: 0;
    background: #5865f2;
    color: #fff;
    padding: 10px 15px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: 700;
    flex-shrink: 0;
}

.watch:hover {
    background: #4752c4;
}

.watch.active {
    background: #3c8c53;
}


/* =========================================================
   STATUS
   ========================================================= */

.player-message {
    padding: 14px;
    color: #aaa;
    font-size: 13px;
    border-top: 1px solid #222;
    background: #080808;
}


/* =========================================================
   EMPTY / ERROR
   ========================================================= */

.empty {
    color: #888;
    background: #0b0b0b;
    border: 1px solid #1d1d1d;
    border-radius: 10px;
    padding: 20px;
    margin-top: 12px;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width: 600px) {

    .header {
        height: 60px;
        padding: 0 14px;
    }

    .brand img {
        height: 40px;
        width: 40px;
    }

    .brand span {
        font-size: 18px;
    }

    .title {
        font-size: 20px;
    }

    .stream {
        flex-direction: column;
        align-items: stretch;
    }

    .watch {
        width: 100%;
    }

    .player-header {
        gap: 10px;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="brand">

        <img
            src="cricketive-logo.webp"
            alt="Cricketive logo"
        >

        <span>
            CRICKETIVE
        </span>

    </div>


    <a
        class="back"
        href="/index.html"
    >
        ← HOME
    </a>

</header>


<main class="wrap">


    <!-- =====================================================
         MATCH
         ===================================================== -->

    <section
        class="match-head"
        id="match"
    >

        <div class="empty">
            Loading match...
        </div>

    </section>


    <!-- =====================================================
         VIDEO PLAYER
         ===================================================== -->

    <section
        class="player"
        id="player"
    >

        <div class="player-header">

            <div
                class="player-title"
                id="playerTitle"
            >
                Cricketive Player
            </div>


            <button
                class="close-player"
                type="button"
                onclick="closePlayer()"
            >
                CLOSE
            </button>

        </div>


        <iframe
            id="video"
            title="Cricketive Stream"
            allowfullscreen
            allow="
                autoplay;
                encrypted-media;
                picture-in-picture;
                fullscreen
            "
            referrerpolicy="no-referrer-when-downgrade"
        ></iframe>


        <div
            class="player-message"
            id="playerMessage"
        >
            Loading stream...
        </div>

    </section>


    <!-- =====================================================
         STREAMS
         ===================================================== -->

    <section class="streams">

        <h2>
            🎥 Available Streams
        </h2>


        <div id="streamList">

            <div class="empty">
                Loading streams...
            </div>

        </div>

    </section>


</main>


<script>


/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://qkzwzdyahwzcwtqgcbud.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_wgba0C-XWm2B6UA-d93Rhw_9aWXKMVC";

const db =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   MATCH ID
   ========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const matchId =
    params.get("match");


/* =========================================================
   LOAD
   ========================================================= */

async function load() {

    const matchEl =
        document.getElementById(
            "match"
        );

    const streamEl =
        document.getElementById(
            "streamList"
        );


    if (
        !matchId
    ) {

        matchEl.innerHTML =
            `
                <div class="empty">
                    No match selected.
                </div>
            `;

        return;

    }


    try {

        /* =================================================
           LOAD MATCH
           ================================================= */

        const {
            data: match,
            error: matchError
        } = await db
            .from("Matches")
            .select("*")
            .eq(
                "id",
                matchId
            )
            .maybeSingle();


        if (
            matchError
        ) {

            throw matchError;

        }


        if (
            !match
        ) {

            matchEl.innerHTML =
                `
                    <div class="empty">
                        Match not found.
                    </div>
                `;

            streamEl.innerHTML =
                `
                    <div class="empty">
                        No streams available.
                    </div>
                `;

            return;

        }


        document.title =
            `${match.team1} vs ${match.team2} | Cricketive`;


        /* =================================================
           MATCH HEADER
           ================================================= */

        const startTime =
            match.start_time
                ? formatDate(
                    match.start_time
                )
                : (
                    match.match_time ||
                    ""
                );


        const isLive =
            String(
                match.status ||
                ""
            ).toLowerCase()
            ===
            "live";


        matchEl.innerHTML =
            `

                <div class="title">

                    ${esc(
                        match.team1 ||
                        ""
                    )}

                    vs

                    ${esc(
                        match.team2 ||
                        ""
                    )}

                </div>


                <div class="meta">

                    ${esc(
                        match.competition ||
                        "Cricket"
                    )}

                    ${
                        startTime
                            ? `
                                <br>
                                ${esc(
                                    startTime
                                )}
                              `
                            : ""
                    }

                    ${
                        match.venue
                            ? `
                                <br>
                                ${esc(
                                    match.venue
                                )}
                              `
                            : ""
                    }

                </div>


                ${
                    isLive

                        ? `
                            <span class="live-badge">
                                🔴 LIVE
                            </span>
                          `

                        : `
                            <span class="upcoming-badge">
                                ${
                                    esc(
                                        match.status ||
                                        "MATCH"
                                    )
                                }
                            </span>
                          `
                }

            `;


        /* =================================================
           LOAD STREAMS
           ================================================= */

        const {
            data: streams,
            error: streamError
        } = await db
            .from("streams")
            .select(
                "*"
            )
            .eq(
                "match_id",
                matchId
            )
            .eq(
                "active",
                true
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


        if (
            streamError
        ) {

            throw streamError;

        }


        if (
            !streams ||
            !streams.length
        ) {

            streamEl.innerHTML =
                `
                    <div class="empty">

                        ⏳ No stream is available
                        for this match yet.

                    </div>
                `;

            return;

        }


        /* =================================================
           RENDER STREAMS
           ================================================= */

        streamEl.innerHTML =
            streams
                .map(
                    (
                        stream,
                        index
                    ) =>
                        createStream(
                            stream,
                            index
                        )
                )
                .join("");


        /*
         * If there is exactly one stream,
         * automatically select it.
         *
         * This makes the WATCH MATCH flow smoother.
         */

        if (
            streams.length === 1
        ) {

            playStream(
                streams[0],
                0
            );

        }


    } catch (error) {

        console.error(
            "Stream page error:",
            error
        );


        matchEl.innerHTML =
            `
                <div class="empty">
                    Unable to load match.
                </div>
            `;


        streamEl.innerHTML =
            `
                <div class="empty">
                    Unable to load streams.
                </div>
            `;

    }

}


/* =========================================================
   CREATE STREAM ROW
   ========================================================= */

function createStream(
    stream,
    index
) {

    const language =
        stream.language ||
        "Unknown";


    const name =
        stream.stream_name ||
        "Stream";


    return `

        <div
            class="stream"
            id="stream-row-${index}"
        >


            <div class="stream-info">

                <div class="stream-language">

                    ${esc(
                        language
                    )}

                </div>


                <div class="stream-name">

                    ${esc(
                        name
                    )}

                </div>

            </div>


            <button
                class="watch"
                type="button"
                onclick='playStream(
                    ${JSON.stringify(stream)},
                    ${index}
                )'
            >

                ▶ WATCH

            </button>


        </div>

    `;

}


/* =========================================================
   PLAY STREAM
   ========================================================= */

function playStream(
    stream,
    index
) {

    const embedUrl =
        String(
            stream.embed_url ||
            ""
        ).trim();


    if (
        !embedUrl
    ) {

        document.getElementById(
            "playerMessage"
        ).textContent =
            "This stream does not have a valid embed URL.";

        document.getElementById(
            "player"
        ).style.display =
            "block";

        return;

    }


    const player =
        document.getElementById(
            "player"
        );

    const video =
        document.getElementById(
            "video"
        );

    const title =
        document.getElementById(
            "playerTitle"
        );

    const message =
        document.getElementById(
            "playerMessage"
        );


    /*
     * Set the player source.
     */

    video.src =
        embedUrl;


    title.textContent =
        stream.stream_name ||
        stream.language ||
        "Cricketive Player";


    message.textContent =
        "Loading stream...";


    player.style.display =
        "block";


    /*
     * Highlight selected stream.
     */

    document
        .querySelectorAll(
            ".watch"
        )
        .forEach(
            button => {

                button.classList.remove(
                    "active"
                );

            }
        );


    const row =
        document.getElementById(
            `stream-row-${index}`
        );


    if (row) {

        const button =
            row.querySelector(
                ".watch"
            );


        if (button) {

            button.classList.add(
                "active"
            );

        }

    }


    /*
     * Scroll to player.
     */

    player.scrollIntoView({
        behavior:
            "smooth",

        block:
            "center"
    });


    /*
     * Give iframe a moment to load.
     */

    setTimeout(
        () => {

            message.textContent =
                "If the player does not load, the stream embed may not allow iframe playback.";

        },
        2500
    );

}


/* =========================================================
   CLOSE PLAYER
   ========================================================= */

function closePlayer() {

    const player =
        document.getElementById(
            "player"
        );

    const video =
        document.getElementById(
            "video"
        );


    video.src =
        "about:blank";


    player.style.display =
        "none";

}


/* =========================================================
   DATE
   ========================================================= */

function formatDate(
    value
) {

    const date =
        new Date(
            value
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return date.toLocaleString(
        [],
        {
            dateStyle:
                "medium",

            timeStyle:
                "short"
        }
    );

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function esc(
    value
) {

    return String(
        value ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   START
   ========================================================= */

load();

</script>

</body>

</html>
