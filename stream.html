<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Cricketive | Match</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

.header {
    height: 70px;
    padding: 0 28px;
    display: flex;
    align-items: center;
    background: #090909;
    border-bottom: 1px solid #222;
}

.brand {
    display: flex;
    align-items: center;
}

.brand img {
    height: 48px;
    width: 48px;
    object-fit: cover;
    border-radius: 8px;
}

.brand span {
    font-weight: 800;
    font-size: 21px;
    margin-left: 9px;
}

.back {
    margin-left: auto;
    color: #fff;
    text-decoration: none;
    background: #222;
    padding: 9px 13px;
    border-radius: 7px;
    font-size: 13px;
}

.wrap {
    max-width: 1050px;
    margin: auto;
    padding: 28px 15px 50px;
}


/* =========================================================
   MATCH HEADER
   ========================================================= */

.match-head {
    background: #101010;
    border: 1px solid #252525;
    border-radius: 12px;
    padding: 20px;
}

.title {
    font-size: 24px;
    font-weight: 800;
}

.meta {
    color: #999;
    font-size: 13px;
    line-height: 1.6;
    margin-top: 8px;
}

.live-badge {
    display: inline-block;
    margin-top: 12px;
    padding: 6px 10px;
    border-radius: 20px;
    background: #3a1010;
    color: #ff6666;
    font-size: 11px;
    font-weight: 700;
}

.status-badge {
    display: inline-block;
    margin-top: 12px;
    padding: 6px 10px;
    border-radius: 20px;
    background: #222;
    color: #aaa;
    font-size: 11px;
    font-weight: 700;
}


/* =========================================================
   PLAYER
   ========================================================= */

.player {
    display: none;
    margin-top: 20px;
    background: #000;
    border: 1px solid #252525;
    border-radius: 12px;
    overflow: hidden;
}

.player-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    background: #0b0b0b;
    border-bottom: 1px solid #222;
}

.player-title {
    font-size: 13px;
    font-weight: 700;
}

.close-player {
    border: 0;
    background: #222;
    color: #fff;
    padding: 6px 9px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
}

.player iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 0;
    display: block;
    background: #000;
}

.player video {
    width: 100%;
    display: block;
    background: #000;
    max-height: 70vh;
}

.player-message {
    padding: 12px 14px;
    color: #aaa;
    font-size: 12px;
    border-top: 1px solid #222;
    background: #080808;
}


/* =========================================================
   STREAMS
   ========================================================= */

.streams {
    margin-top: 24px;
}

.streams h2 {
    margin: 0 0 12px;
    font-size: 21px;
}

.stream {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: #101010;
    border: 1px solid #252525;
    border-radius: 9px;
    padding: 14px;
    margin-top: 9px;
}

.stream-info {
    min-width: 0;
}

.stream-language {
    font-weight: 700;
    font-size: 14px;
}

.stream-name {
    color: #999;
    font-size: 12px;
    margin-top: 4px;
}

.stream-type {
    color: #666;
    font-size: 10px;
    margin-top: 4px;
}

.watch {
    border: 0;
    background: #5865f2;
    color: #fff;
    padding: 10px 15px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: 700;
    flex-shrink: 0;
}

.watch:hover {
    background: #4752c4;
}

.watch.active {
    background: #3c8c53;
}


/* =========================================================
   STATES
   ========================================================= */

.empty {
    color: #888;
    background: #0b0b0b;
    border: 1px solid #1d1d1d;
    border-radius: 10px;
    padding: 20px;
    margin-top: 12px;
}

.error-box {
    color: #ff8b8b;
    background: #210e0e;
    border: 1px solid #4a2020;
    border-radius: 10px;
    padding: 16px;
    margin-top: 12px;
    font-size: 13px;
    line-height: 1.5;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .header {
        height: 60px;
        padding: 0 14px;
    }

    .brand img {
        height: 40px;
        width: 40px;
    }

    .brand span {
        font-size: 18px;
    }

    .title {
        font-size: 20px;
    }

    .stream {
        flex-direction: column;
        align-items: stretch;
    }

    .watch {
        width: 100%;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="brand">

        <img
            src="cricketive-logo.webp"
            alt="Cricketive logo"
        >

        <span>CRICKETIVE</span>

    </div>

    <a
        class="back"
        href="/index.html"
    >
        ← HOME
    </a>

</header>


<main class="wrap">


    <section
        class="match-head"
        id="match"
    >
        <div class="empty">
            Loading match...
        </div>
    </section>


    <section
        class="player"
        id="player"
    >

        <div class="player-header">

            <div
                class="player-title"
                id="playerTitle"
            >
                Cricketive Player
            </div>

            <button
                class="close-player"
                type="button"
                onclick="closePlayer()"
            >
                CLOSE
            </button>

        </div>


        <iframe
            id="videoFrame"
            title="Cricketive Stream"
            allowfullscreen
            allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        ></iframe>


        <video
            id="videoPlayer"
            controls
            playsinline
        ></video>


        <div
            class="player-message"
            id="playerMessage"
        >
            Loading stream...
        </div>

    </section>


    <section class="streams">

        <h2>
            🎥 Available Streams
        </h2>

        <div id="streamList">

            <div class="empty">
                Loading streams...
            </div>

        </div>

    </section>


</main>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://qkzwzdyahwzcwtqgcbud.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_wgba0C-XWm2B6UA-d93Rhw_9aWXKMVC";

const db =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   MATCH ID
   ========================================================= */

const matchId =
    new URLSearchParams(
        window.location.search
    ).get("match");


/* =========================================================
   STREAM CACHE
   ========================================================= */

let streams = [];


/* =========================================================
   DOM HELPERS
   ========================================================= */

function matchElement() {
    return document.getElementById("match");
}

function streamElement() {
    return document.getElementById("streamList");
}


/* =========================================================
   LOAD PAGE
   ========================================================= */

async function load() {

    try {

        if (!matchId) {

            throw new Error(
                "No match ID was provided in the URL."
            );

        }


        /* =================================================
           GET MATCH
           ================================================= */

        const matchResult =
            await db
                .from("Matches")
                .select("*")
                .eq("id", matchId)
                .maybeSingle();


        if (matchResult.error) {

            throw new Error(
                `Match query failed: ${matchResult.error.message}`
            );

        }


        if (!matchResult.data) {

            throw new Error(
                `No match exists for ID: ${matchId}`
            );

        }


        const match =
            matchResult.data;


        /* =================================================
           RENDER MATCH
           ================================================= */

        document.title =
            `${match.team1 || "Team 1"} vs ${match.team2 || "Team 2"} | Cricketive`;


        const time =
            match.start_time
                ? formatDate(match.start_time)
                : (
                    match.match_time || ""
                );


        const isLive =
            String(
                match.status || ""
            )
                .trim()
                .toLowerCase()
            === "live";


        matchElement().innerHTML =
            `

                <div class="title">

                    ${esc(
                        match.team1 || ""
                    )}

                    vs

                    ${esc(
                        match.team2 || ""
                    )}

                </div>


                <div class="meta">

                    ${esc(
                        match.competition ||
                        "Cricket"
                    )}

                    ${
                        time
                            ? `
                                <br>
                                ${esc(time)}
                              `
                            : ""
                    }

                    ${
                        match.venue
                            ? `
                                <br>
                                ${esc(match.venue)}
                              `
                            : ""
                    }

                </div>


                ${
                    isLive
                        ? `
                            <span class="live-badge">
                                🔴 LIVE
                            </span>
                          `
                        : `
                            <span class="status-badge">
                                ${esc(
                                    match.status ||
                                    "MATCH"
                                )}
                            </span>
                          `
                }

            `;


        /* =================================================
           GET STREAMS
           ================================================= */

        const streamResult =
            await db
                .from("streams")
                .select("*")
                .eq("match_id", matchId)
                .eq("active", true)
                .order(
                    "created_at",
                    {
                        ascending: true
                    }
                );


        if (streamResult.error) {

            throw new Error(
                `Stream query failed: ${streamResult.error.message}`
            );

        }


        streams =
            streamResult.data || [];


        /* =================================================
           RENDER STREAMS
           ================================================= */

        if (!streams.length) {

            streamElement().innerHTML =
                `
                    <div class="empty">
                        ⏳ No active stream is available
                        for this match yet.
                    </div>
                `;

            return;

        }


        streamElement().innerHTML =
            streams
                .map(
                    (
                        stream,
                        index
                    ) =>
                        createStreamRow(
                            stream,
                            index
                        )
                )
                .join("");


    } catch (error) {

        console.error(
            "Cricketive stream page error:",
            error
        );


        matchElement().innerHTML =
            `
                <div class="error-box">

                    <strong>
                        Unable to load match
                    </strong>

                    <br><br>

                    ${esc(
                        error.message
                    )}

                </div>
            `;


        streamElement().innerHTML =
            `
                <div class="error-box">

                    <strong>
                        Unable to load streams
                    </strong>

                    <br><br>

                    Check the browser console for details.

                </div>
            `;

    }

}


/* =========================================================
   STREAM ROW
   ========================================================= */

function createStreamRow(
    stream,
    index
) {

    const url =
        String(
            stream.embed_url || ""
        ).trim();


    const type =
        detectStreamType(url);


    const buttonText =
        type === "direct"
            ? "▶ OPEN STREAM"
            : "▶ WATCH";


    return `

        <div
            class="stream"
            id="stream-row-${index}"
        >

            <div class="stream-info">

                <div class="stream-language">
                    ${esc(
                        stream.language ||
                        "Unknown"
                    )}
                </div>

                <div class="stream-name">
                    ${esc(
                        stream.stream_name ||
                        "Stream"
                    )}
                </div>

                <div class="stream-type">
                    ${esc(
                        getStreamTypeLabel(type)
                    )}
                </div>

            </div>


            <button
                class="watch"
                type="button"
                onclick="openStream(${index})"
            >
                ${buttonText}
            </button>

        </div>

    `;
}


/* =========================================================
   OPEN STREAM
   ========================================================= */

function openStream(index) {

    const stream =
        streams[index];


    if (!stream) {

        showPlayerMessage(
            "Stream not found."
        );

        return;

    }


    const url =
        String(
            stream.embed_url || ""
        ).trim();


    if (!url) {

        showPlayerMessage(
            "This stream has no URL."
        );

        return;

    }


    const type =
        detectStreamType(url);


    setActiveButton(index);


    /* =====================================================
       DIRECT PAGE
       ===================================================== */

    if (
        type === "direct"
    ) {

        window.location.href =
            url;

        return;

    }


    /* =====================================================
       YOUTUBE
       ===================================================== */

    if (
        type === "youtube"
    ) {

        const embedUrl =
            youtubeEmbedUrl(url);


        if (!embedUrl) {

            window.location.href =
                url;

            return;

        }


        showIframe(
            embedUrl,
            stream.stream_name ||
            "YouTube"
        );

        return;

    }


    /* =====================================================
       MP4
       ===================================================== */

    if (
        type === "mp4"
    ) {

        showVideo(
            url,
            stream.stream_name ||
            "Video Stream"
        );

        return;

    }


    /* =====================================================
       HLS
       ===================================================== */

    if (
        type === "hls"
    ) {

        const video =
            document.getElementById(
                "videoPlayer"
            );


        /*
         * Native browser HLS.
         */

        if (
            video.canPlayType(
                "application/vnd.apple.mpegurl"
            )
        ) {

            showVideo(
                url,
                stream.stream_name ||
                "Live Stream"
            );

        } else {

            /*
             * Browser cannot play raw HLS.
             * Open the stream URL directly.
             */

            window.location.href =
                url;

        }

        return;

    }


    /* =====================================================
       NORMAL EMBED
       ===================================================== */

    showIframe(
        url,
        stream.stream_name ||
        "Cricketive Stream"
    );

}


/* =========================================================
   DETECT STREAM TYPE
   ========================================================= */

function detectStreamType(url) {

    const value =
        String(
            url || ""
        )
            .trim()
            .toLowerCase();


    if (!value) {

        return "direct";

    }


    /* YouTube */

    if (
        value.includes("youtube.com") ||
        value.includes("youtu.be")
    ) {

        return "youtube";

    }


    /* HLS */

    if (
        value.includes(".m3u8")
    ) {

        return "hls";

    }


    /* MP4 */

    if (
        value.includes(".mp4")
    ) {

        return "mp4";

    }


    /* External player pages */

    if (
        value.includes("blogspot.com") ||
        value.includes("blogger.com") ||
        value.includes("ckdlive")
    ) {

        return "direct";

    }


    return "embed";
}


/* =========================================================
   STREAM TYPE LABEL
   ========================================================= */

function getStreamTypeLabel(type) {

    switch (type) {

        case "youtube":
            return "YouTube";

        case "hls":
            return "HLS";

        case "mp4":
            return "MP4";

        case "direct":
            return "External Player";

        case "embed":
            return "Embedded Player";

        default:
            return "Stream";
    }

}


/* =========================================================
   YOUTUBE EMBED
   ========================================================= */

function youtubeEmbedUrl(urlValue) {

    try {

        const url =
            new URL(urlValue);


        let id = "";


        if (
            url.hostname.includes("youtube.com")
        ) {

            id =
                url.searchParams.get("v") || "";


            if (
                !id &&
                url.pathname.startsWith("/live/")
            ) {

                id =
                    url.pathname
                        .split("/live/")[1]
                        .split("/")[0];

            }


            if (
                !id &&
                url.pathname.includes("/embed/")
            ) {

                id =
                    url.pathname
                        .split("/embed/")[1]
                        .split("/")[0];

            }

        }


        if (
            url.hostname === "youtu.be"
        ) {

            id =
                url.pathname
                    .replace(/^\//, "")
                    .split("/")[0];

        }


        if (!id) {

            return null;

        }


        return (
            "https://www.youtube.com/embed/" +
            encodeURIComponent(id) +
            "?autoplay=1"
        );

    } catch {

        return null;

    }

}


/* =========================================================
   SHOW IFRAME
   ========================================================= */

function showIframe(
    url,
    title
) {

    const player =
        document.getElementById(
            "player"
        );

    const frame =
        document.getElementById(
            "videoFrame"
        );

    const video =
        document.getElementById(
            "videoPlayer"
        );


    video.pause();
    video.removeAttribute("src");
    video.style.display = "none";


    frame.src = url;
    frame.style.display = "block";


    document.getElementById(
        "playerTitle"
    ).textContent =
        title;


    player.style.display =
        "block";


    showPlayerMessage(
        "Loading stream..."
    );


    player.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });

}


/* =========================================================
   SHOW VIDEO
   ========================================================= */

function showVideo(
    url,
    title
) {

    const player =
        document.getElementById(
            "player"
        );

    const frame =
        document.getElementById(
            "videoFrame"
        );

    const video =
        document.getElementById(
            "videoPlayer"
        );


    frame.src =
        "about:blank";

    frame.style.display =
        "none";


    video.src =
        url;

    video.style.display =
        "block";


    document.getElementById(
        "playerTitle"
    ).textContent =
        title;


    player.style.display =
        "block";


    showPlayerMessage(
        "Loading stream..."
    );


    video.play().catch(
        () => {}
    );


    player.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });

}


/* =========================================================
   CLOSE PLAYER
   ========================================================= */

function closePlayer() {

    const player =
        document.getElementById(
            "player"
        );

    const frame =
        document.getElementById(
            "videoFrame"
        );

    const video =
        document.getElementById(
            "videoPlayer"
        );


    frame.src =
        "about:blank";


    video.pause();

    video.removeAttribute(
        "src"
    );


    player.style.display =
        "none";

}


/* =========================================================
   ACTIVE BUTTON
   ========================================================= */

function setActiveButton(
    index
) {

    document
        .querySelectorAll(
            ".watch"
        )
        .forEach(
            button => {

                button.classList.remove(
                    "active"
                );

            }
        );


    const row =
        document.getElementById(
            `stream-row-${index}`
        );


    if (!row) {
        return;
    }


    const button =
        row.querySelector(
            ".watch"
        );


    if (button) {

        button.classList.add(
            "active"
        );

    }

}


/* =========================================================
   PLAYER MESSAGE
   ========================================================= */

function showPlayerMessage(
    message
) {

    document.getElementById(
        "playerMessage"
    ).textContent =
        message;

}


/* =========================================================
   DATE
   ========================================================= */

function formatDate(
    value
) {

    const date =
        new Date(
            value
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return date.toLocaleString(
        [],
        {
            dateStyle: "medium",
            timeStyle: "short"
        }
    );

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function esc(
    value
) {

    return String(
        value ?? ""
    )
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   START
   ========================================================= */

load();

</script>

</body>

</html>
