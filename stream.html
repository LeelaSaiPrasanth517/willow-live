<section class="player" id="player">

    <div class="player-header">

        <div class="player-title" id="playerTitle">
            Cricketive Player
        </div>

        <button
            class="close-player"
            onclick="closePlayer()"
        >
            CLOSE
        </button>

    </div>

    <div id="videoContainer">

        <video
            id="videoPlayer"
            controls
            playsinline
        ></video>

    </div>

    <div id="iframeContainer">

        <iframe
            id="videoFrame"
            allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
            allowfullscreen>
        </iframe>

    </div>

    <div id="playerMessage">
        Loading stream...
    </div>

</section>
