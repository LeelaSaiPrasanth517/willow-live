<section class="player" id="player">

    <div class="player-header">
        <div class="player-title" id="playerTitle">
            Cricketive Player
        </div>

        <button
            class="close-player"
            type="button"
            onclick="closePlayer()"
        >
            CLOSE
        </button>
    </div>

    <div class="video-crop" id="videoCrop">

        <iframe
            id="videoFrame"
            title="Cricketive Stream"
            allowfullscreen
            allow="
                autoplay;
                encrypted-media;
                picture-in-picture;
                fullscreen
            "
        ></iframe>

    </div>

    <div
        class="player-message"
        id="playerMessage"
    >
        Loading stream...
    </div>

</section>
