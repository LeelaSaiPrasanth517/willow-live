<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cricketive | Global Cricket Live</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh}.header{height:70px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:#090909;border-bottom:1px solid #222}.brand{display:flex;align-items:center}.brand img{width:48px;height:48px;object-fit:cover;border-radius:8px}.brand span{margin-left:9px;font-size:21px;font-weight:800}.live{font-size:13px;font-weight:700}.live-dot{display:inline-block;width:9px;height:9px;background:#f33;border-radius:50%;margin-right:7px}.hero{text-align:center;padding:38px 15px 28px}.hero h1{margin:0;font-size:30px}.hero p{color:#999;font-size:14px}.matches{max-width:1050px;margin:auto;padding:0 15px 35px}.section-title{margin:20px 0 14px;font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.match-card{background:#101010;border:1px solid #252525;border-radius:12px;padding:18px}.match-card.live{border-color:#613535}.match-header{display:flex;justify-content:space-between;gap:10px}.match-name{min-width:0;flex:1;font-size:17px;font-weight:700}.team-line{display:flex;align-items:center;gap:9px;margin-bottom:7px}.team-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.team-score{font-weight:900;white-space:nowrap}.vs{margin:2px 0 6px;color:#777;font-size:11px}.match-info{margin-top:11px;color:#999;font-size:13px;line-height:1.55}.status{flex:0 0 auto;min-height:28px;padding:6px 9px;border-radius:20px;background:#222;font-size:10px;font-weight:700}.live-status{background:#3a1010;color:#ff6666}.upcoming-status{background:#1e2b39;color:#8fc7ff}.unknown-status{background:#5a4a12;color:#ffd56a}.stream-badge{display:inline-block;margin-top:11px;padding:5px 9px;border-radius:20px;background:#16321e;color:#72d38b;font-size:10px;font-weight:700}.no-stream{margin-top:11px;color:#999;font-size:12px}.watch-button{display:inline-block;margin-top:14px;padding:10px 16px;background:#5865f2;color:#fff;text-decoration:none;border-radius:7px;font-size:13px;font-weight:700}.empty{color:#777;text-align:center;padding:22px;background:#0b0b0b;border:1px solid #1d1d1d;border-radius:10px}.updated{text-align:center;color:#666;font-size:11px;margin-top:8px}.community{text-align:center;padding:38px 15px;background:#090909}.community p{color:#999}.community-button{display:inline-block;padding:12px 20px;background:#5865f2;color:#fff;text-decoration:none;border-radius:8px;font-weight:700}footer{text-align:center;padding:18px;background:#030303;color:#666;font-size:11px}@media(max-width:700px){.matches{padding-left:12px;padding-right:12px}.header{padding:0 14px}.brand span{font-size:18px}}
</style></head>
<body><header class="header"><div class="brand"><img src="cricketive-logo.webp" alt="Cricketive"><span>CRICKETIVE</span></div><div class="live"><span class="live-dot"></span>LIVE CRICKET</div></header><section class="hero"><h1>Global Cricket Live</h1><p>Live scores, schedules and available streams.</p></section><main class="matches"><h2 class="section-title">🔴 Live Matches</h2><div id="liveMatches"><div class="empty">Loading...</div></div><h2 class="section-title">📅 Upcoming</h2><div id="upcomingMatches"><div class="empty">Loading...</div></div><h2 class="section-title">✅ Finished</h2><div id="finishedMatches"><div class="empty">Loading...</div></div><div id="updatedTime" class="updated"></div></main><section class="community"><h2>Join the Cricketive Community</h2><p>Talk cricket with fans around the world.</p></section><footer>Cricketive · Global Cricket Live</footer>
<script>
async function load(){try{const r=await fetch("/api/cricket/live",{cache:"no-store"}),ct=r.headers.get("content-type")||"";if(!r.ok||!ct.includes("json"))throw new Error(`Live API ${r.status}`);const p=await r.json();render(p.matches||[]);document.getElementById("updatedTime").textContent=`Updated ${new Date(p.generated_at||Date.now()).toLocaleTimeString()}${p.stale?" · Data temporarily delayed":""}`;}catch(e){console.error(e);document.getElementById("liveMatches").innerHTML='<div class="empty">Unable to load live matches.</div>';document.getElementById("upcomingMatches").innerHTML='<div class="empty">Unable to load matches.</div>';}}
function render(ms){document.getElementById("liveMatches").innerHTML=cards(ms.filter(m=>m.status==="LIVE"));document.getElementById("upcomingMatches").innerHTML=cards(ms.filter(m=>["UPCOMING","SUSPENDED","RAIN_DELAY","INNINGS_BREAK","DAY_BREAK","POSTPONED"].includes(m.status)));document.getElementById("finishedMatches").innerHTML=cards(ms.filter(m=>["FINISHED","CANCELLED","ABANDONED"].includes(m.status)));}
function cards(a){if(!a.length)return'<div class="empty">No matches listed.</div>';return'<div class="grid">'+a.map(card).join("")+"</div>"}
function card(m){const h=m.score?.home?.text??"—",a=m.score?.away?.text??"—",s=String(m.status||"UNKNOWN"),c=s==="LIVE"?"live-status":s==="UNKNOWN"?"unknown-status":"upcoming-status",action=m.legacy_match_id?`<a class="watch-button" href="/stream.html?match=${encodeURIComponent(m.legacy_match_id)}">${m.has_stream?"▶ WATCH MATCH":"VIEW MATCH"}</a>`:"";return`<article class="match-card ${s==="LIVE"?"live":""}"><div class="match-header"><div class="match-name"><div class="team-line"><span class="team-name">${esc(m.team1)}</span><span class="team-score">${esc(h)}</span></div><div class="vs">VS</div><div class="team-line"><span class="team-name">${esc(m.team2)}</span><span class="team-score">${esc(a)}</span></div><div class="match-info">${esc(m.competition||"Cricket")}<br>${m.start_time?esc(new Date(m.start_time).toLocaleString()):""}${m.score?.overs?`<br>Overs: ${esc(m.score.overs)}`:""}${m.batting_team?`<br>Batting: ${esc(m.batting_team)}`:""}</div></div><span class="status ${c}">${esc(s.replaceAll("_"," "))}</span></div>${m.has_stream?`<div class="stream-badge">🎥 ${m.stream_count} STREAM${m.stream_count===1?"":"S"} AVAILABLE</div>`:'<div class="no-stream">⏳ Stream unavailable</div>'}${action}</article>`}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}load();setInterval(load,30000);
</script></body></html>
