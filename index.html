<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cricketive | Global Cricket Live</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
.header{height:70px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:#090909;border-bottom:1px solid #222}
.brand img{height:48px;width:48px;object-fit:cover;border-radius:8px;vertical-align:middle}.brand span{font-weight:800;font-size:21px;margin-left:9px;vertical-align:middle}
.live{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700}.live-dot{width:9px;height:9px;background:#ff3030;border-radius:50%;box-shadow:0 0 10px rgba(255,48,48,.8)}
.hero{text-align:center;padding:38px 15px 28px}.hero h1{margin:0;font-size:30px}.hero p{color:#999;font-size:14px}
.matches{width:100%;max-width:1050px;margin:auto;padding:0 15px 35px}.section-title{font-size:20px;margin:20px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.match-card{background:#101010;border:1px solid #252525;border-radius:12px;padding:18px}
.match-name{font-size:18px;font-weight:700}.match-info{color:#999;font-size:13px;margin-top:8px;line-height:1.55}
.status{display:inline-block;margin-top:11px;padding:5px 9px;border-radius:20px;background:#222;font-size:11px}.live-status{background:#3a1010;color:#ff6666}
.available{color:#72d38b;font-size:12px;margin-top:9px}.unavailable{color:#999;font-size:12px}
.score-box{margin-top:13px;padding:12px;background:#080808;border:1px solid #222;border-radius:9px}.score-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px}.score-row strong{font-size:16px}.score-status{color:#999;font-size:12px;margin-top:7px}
.watch-button{display:inline-block;margin-top:14px;padding:10px 16px;background:#5865f2;color:#fff;text-decoration:none;border-radius:7px;font-size:13px;font-weight:700}
.empty{color:#777;text-align:center;padding:22px;background:#0b0b0b;border:1px solid #1d1d1d;border-radius:10px}
.community{text-align:center;padding:38px 15px 48px;background:#090909}.community h2{margin:0}.community p{color:#999;font-size:14px}
.community-button{display:inline-block;padding:12px 20px;background:#5865f2;color:#fff;text-decoration:none;border-radius:8px;font-weight:700}
footer{text-align:center;padding:18px;background:#030303;color:#666;font-size:11px}@media(max-width:600px){.header{height:60px;padding:0 14px}.brand img{height:40px;width:40px}.brand span{font-size:18px}.hero h1{font-size:23px}}
</style>
</head>
<body>
<header class="header"><div class="brand"><img src="cricketive-logo.webp" alt="Cricketive logo"><span>CRICKETIVE</span></div><div class="live"><span class="live-dot"></span>LIVE</div></header>
<section class="hero"><h1>🌍 Global Cricket Live</h1><p>Watch cricket from around the world</p></section>
<main class="matches"><h2 class="section-title">🔴 Live Now</h2><div id="liveMatches"><div class="empty">Loading matches...</div></div>
<h2 class="section-title">📅 Upcoming Matches</h2><div id="upcomingMatches"><div class="empty">Loading matches...</div></div></main>
<section class="community"><h2>💬 Join Cricketive</h2><p>Talk cricket, follow matches and connect with fans worldwide.</p><a class="community-button" href="https://discord.gg/SYfPEKRrnQ" target="_blank" rel="noopener noreferrer">JOIN OUR DISCORD</a></section>
<footer>© 2026 Cricketive • Global Cricket Community</footer>
<script>
const SUPABASE_URL="https://qkzwzdyahwzcwtqgcbud.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_wgba0C-XWm2B6UA-d93Rhw_9aWXKMVC";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

async function loadMatches(){
  const liveEl=document.getElementById("liveMatches"), upcomingEl=document.getElementById("upcomingMatches");
  const {data,error}=await db.from("Matches").select("*").order("start_time",{ascending:true});
  if(error){liveEl.innerHTML='<div class="empty">Unable to load matches.</div>';upcomingEl.innerHTML="";return;}

  let current=[];
  try{
    const r=await fetch("/.netlify/functions/cricket-matches?mode=scores");
    if(r.ok){const p=await r.json();current=p.matches||[];}
  }catch(e){console.warn(e);}
  const byId={}; current.forEach(m=>{if(m.id)byId[m.id]=m;});

  const ids=(data||[]).map(m=>m.id);
  let streams=[];
  if(ids.length){const r=await db.from("streams").select("match_id,active").in("match_id",ids).eq("active",true);if(!r.error)streams=r.data||[];}
  const count={};streams.forEach(s=>count[s.match_id]=(count[s.match_id]||0)+1);

  const now=Date.now(), live=[], upcoming=[];
  (data||[]).forEach(m=>{
    const c=byId[m.api_match_id];
    const started=c ? c.matchStarted : (m.start_time && new Date(m.start_time).getTime()<=now);
    const ended=c ? c.matchEnded : false;
    if(started&&!ended)live.push({...m,current:c});
    else if(m.start_time && new Date(m.start_time).getTime()>=now)upcoming.push({...m,current:c});
  });
  render(liveEl,live,true,count);render(upcomingEl,upcoming,false,count);
}
function render(el,arr,isLive,count){
  if(!arr.length){el.innerHTML=`<div class="empty">${isLive?"No matches are live right now.":"No upcoming matches listed."}</div>`;return;}
  el.className="grid";
  el.innerHTML=arr.map(m=>{
    const n=count[m.id]||0, score=m.current?.score||[];
    const time=m.start_time?new Date(m.start_time).toLocaleString([], {dateStyle:"medium",timeStyle:"short"}):"";
    const scoreHtml=isLive&&score.length?`<div class="score-box">${score.map(s=>`<div class="score-row"><span>${esc(s.inning||"Innings")}</span><strong>${esc((s.r??0)+"/"+(s.w??0))}${s.o!=null?" ("+esc(s.o)+" ov)":""}</strong></div>`).join("")}${m.current?.status?`<div class="score-status">${esc(m.current.status)}</div>`:""}</div>`:"";
    return `<article class="match-card"><div class="match-name">${esc(m.team1)} vs ${esc(m.team2)}</div><div class="match-info">${esc(m.competition||"Cricket")}<br>${esc(time)}${m.venue?"<br>"+esc(m.venue):""}</div><span class="status ${isLive?"live-status":""}">${isLive?"LIVE":"UPCOMING"}</span>${scoreHtml}${n?`<div class="available">🎥 ${n} stream${n===1?"":"s"} available</div>`:`<div class="unavailable">⏳ Stream unavailable</div>`}<a class="watch-button" href="stream.html?match=${encodeURIComponent(m.id)}">${isLive&&n?"▶ WATCH MATCH":"VIEW MATCH"}</a></article>`;
  }).join("");
}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
loadMatches();setInterval(loadMatches,60000);
</script>
</body>
</html>
