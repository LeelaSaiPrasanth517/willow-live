<body>


<div class="container">

             UPCOMING MATCHES

            </div>

        </div>

<script>


/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://qkzwzdyahwzcwtqgcbud.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_wgba0C-XWm2B6UA-d93Rhw_9aWXKMVC";

const client =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   LOGIN
   ========================================================= */

async function login() {

    const email =
        document
            .getElementById("email")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;

    const message =
        document
            .getElementById("loginMessage");

    if (!email || !password) {

        message.textContent =
            "Enter your email and password.";

        return;
    }

    message.textContent =
        "Signing in...";

    const { error } =
        await client.auth.signInWithPassword({
            email,
            password
        });

    if (error) {

        message.textContent =
            error.message;

        return;
    }

    showAdmin();

}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout() {

    await client.auth.signOut();

    document
        .getElementById("adminPanel")
        .style.display = "none";

    document
        .getElementById("loginPanel")
        .classList
        .remove("hidden");

}


/* =========================================================
   CHECK SESSION
   ========================================================= */

async function checkSession() {

    const { data } =
        await client.auth.getSession();

    if (data.session) {
        showAdmin();
    }

}


/* =========================================================
   SHOW ADMIN
   ========================================================= */

function showAdmin() {

    document
        .getElementById("loginPanel")
        .classList
        .add("hidden");

    document
        .getElementById("adminPanel")
        .style.display = "block";

    loadMatches();

}


/* =========================================================
   SYNC MATCHES
   ========================================================= */

/*
 * =========================================================
 * SYNC IDENTITY HELPERS
 * ========================================================= */

function makeFixtureKey(
    team1,
    team2,
    startTime
) {

    if (
        !team1 ||
        !team2 ||
        !startTime
    ) {
        return "";
    }


    const teams =
        [
            String(team1)
                .trim()
                .toLowerCase(),

            String(team2)
                .trim()
                .toLowerCase()
        ]
            .sort()
            .join("|");


    return (
        `${teams}|${String(startTime)}`
    );

}


function getExistingStream(
    match
) {

    if (!match) {
        return "";
    }


    /*
     * Current schema uses embed_url for the saved stream.
     */

    if (
        match.embed_url
    ) {

        return String(
            match.embed_url
        );

    }


    return "";

}


function hasStream(
    match
) {

    return Boolean(
        getExistingStream(
            match
        )
    );

}


async function syncMatches() {

    const message =
        document.getElementById(
            "syncMessage"
        );

    const button =
        document.getElementById(
            "syncButton"
        );


    message.textContent =
        "Syncing SportScore matches...";

    button.disabled = true;
    button.textContent = "SYNCING...";


    try {

        /* -----------------------------------------------
           Fetch SportScore matches
           ----------------------------------------------- */

        const response =
            await fetch(
                "/api/cricket-matches?mode=matches",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                `API HTTP ${response.status}: ${errorText}`
            );

        }


        const payload =
            await response.json();


        const matches =
            Array.isArray(
                payload.matches
            )
                ? payload.matches
                : [];


        if (!matches.length) {

            message.textContent =
                "SportScore returned 0 matches.";

            await loadMatches();

            return;

        }


        /* -----------------------------------------------
           Load existing Supabase matches
           ----------------------------------------------- */

        const {
            data: existingMatches,
            error: existingError
        } = await client
            .from("Matches")
            .select("*");


        if (existingError) {
            throw existingError;
        }


        const existing =
            existingMatches || [];


        /*
         * Build lookup maps.
         *
         * api_match_id is the strongest identity.
         * SportScore URL is next.
         * Team + scheduled start time is the fallback.
         */

        const byApiMatchId = new Map();
        const bySportScoreUrl = new Map();
        const byFixture = new Map();


        for (const match of existing) {

            if (match.api_match_id) {

                byApiMatchId.set(
                    String(
                        match.api_match_id
                    ),
                    match
                );

            }


            if (match.sportscore_url) {

                bySportScoreUrl.set(
                    normalizeUrl(
                        match.sportscore_url
                    ),
                    match
                );

            }


            const fixtureKey =
                makeFixtureKey(
                    match.team1,
                    match.team2,
                    match.start_time ||
                        match.match_time
                );


            if (fixtureKey) {

                /*
                 * If duplicate database rows already exist,
                 * prefer the row that has a stream.
                 */

                const previous =
                    byFixture.get(
                        fixtureKey
                    );

                if (
                    !previous ||
                    hasStream(match) &&
                    !hasStream(previous)
                ) {

                    byFixture.set(
                        fixtureKey,
                        match
                    );

                }

            }

        }


        /* -----------------------------------------------
           Deduplicate SportScore response
           ----------------------------------------------- */

        const uniqueSportScoreMatches = [];
        const seenIncoming = new Set();


        for (const match of matches) {

            const team1 =
                String(
                    match.home ??
                    match.team1 ??
                    ""
                ).trim();

            const team2 =
                String(
                    match.away ??
                    match.team2 ??
                    ""
                ).trim();

            const startTime =
                match.time ??
                match.start_time ??
                match.match_time ??
                null;


            if (
                !team1 ||
                !team2 ||
                !startTime ||
                isPlaceholder(team1) ||
                isPlaceholder(team2)
            ) {
                continue;
            }


            const rawUrl =
                match.url ??
                match.sportscore_url ??
                null;


            const sportscoreUrl =
                rawUrl
                    ? normalizeUrl(rawUrl)
                    : null;


            const fixtureKey =
                makeFixtureKey(
                    team1,
                    team2,
                    startTime
                );


            /*
             * Prefer URL identity when available; otherwise
             * use the fixture key.
             */

            const incomingKey =
                sportscoreUrl
                    ? `url:${sportscoreUrl}`
                    : `fixture:${fixtureKey}`;


            if (
                seenIncoming.has(
                    incomingKey
                )
            ) {
                continue;
            }


            seenIncoming.add(
                incomingKey
            );


            uniqueSportScoreMatches.push({
                match,
                team1,
                team2,
                startTime,
                sportscoreUrl,
                fixtureKey
            });

        }


        /* -----------------------------------------------
           Process each fixture exactly once
           ----------------------------------------------- */

        let inserted = 0;
        let updated = 0;
        let merged = 0;


        for (
            const item of uniqueSportScoreMatches
        ) {

            const {
                match,
                team1,
                team2,
                startTime,
                sportscoreUrl,
                fixtureKey
            } = item;


            /*
             * Stable ID used for future syncs.
             */

            const apiMatchId =
                sportscoreUrl
                    ? `sportscore:${sportscoreUrl}`
                    : `sportscore:${fixtureKey}`;


            /*
             * Find the existing row.
             *
             * Order matters:
             * 1. Exact API ID
             * 2. Exact SportScore URL
             * 3. Same fixture
             */

            let existingMatch =
                byApiMatchId.get(
                    apiMatchId
                ) ||
                (
                    sportscoreUrl
                        ? bySportScoreUrl.get(
                            sportscoreUrl
                        )
                        : null
                ) ||
                byFixture.get(
                    fixtureKey
                ) ||
                null;


            /*
             * If the exact API ID is different but a fixture
             * match exists, update that existing row instead
             * of creating a second record.
             */

            const currentStream =
                existingMatch
                    ? getExistingStream(
                        existingMatch
                    )
                    : "";


            const row = {

                api_match_id:
                    apiMatchId,

                title:
                    match.title ||
                    `${team1} vs ${team2}`,

                team1:
                    team1,

                team2:
                    team2,

                competition:
                    match.competition ||
                    "Cricket",

                match_time:
                    startTime,

                start_time:
                    startTime,

                venue:
                    match.venue ||
                    "",

                /*
                 * Keep the SportScore status for reference.
                 * The Admin display status is calculated from
                 * start_time separately.
                 */

                status:
                    normalizeSportScoreStatus(
                        match.status
                    ),

                /*
                 * NEVER erase a stream during sync.
                 */

                embed_url:
                    currentStream,

                team1_logo:
                    match.home_logo ||
                    match.team1_logo ||
                    "",

                team2_logo:
                    match.away_logo ||
                    match.team2_logo ||
                    ""

            };


            if (
                existingMatch &&
                existingMatch.id
            ) {

                const {
                    error: updateError
                } = await client
                    .from("Matches")
                    .update(row)
                    .eq(
                        "id",
                        existingMatch.id
                    );


                if (updateError) {
                    throw updateError;
                }


                updated++;


                /*
                 * Keep the lookup maps pointed at the
                 * surviving record.
                 */

                const surviving = {
                    ...existingMatch,
                    ...row
                };


                byApiMatchId.set(
                    apiMatchId,
                    surviving
                );


                if (sportscoreUrl) {

                    bySportScoreUrl.set(
                        sportscoreUrl,
                        surviving
                    );

                }


                byFixture.set(
                    fixtureKey,
                    surviving
                );


            } else {

                const {
                    data: insertedRows,
                    error: insertError
                } = await client
                    .from("Matches")
                    .insert(row)
                    .select();


                if (insertError) {
                    throw insertError;
                }


                inserted++;


                const insertedMatch =
                    insertedRows &&
                    insertedRows[0];


                if (insertedMatch) {

                    byApiMatchId.set(
                        apiMatchId,
                        insertedMatch
                    );

                    if (sportscoreUrl) {

                        bySportScoreUrl.set(
                            sportscoreUrl,
                            insertedMatch
                        );

                    }

                    byFixture.set(
                        fixtureKey,
                        insertedMatch
                    );

                }

            }

        }


        /*
         * Reload the actual database schedule.
         * loadMatches() calculates current Live/Upcoming/
         * Finished counts from start_time.
         */

        message.innerHTML =
            `Sync complete. ` +
            `Updated <strong>${updated}</strong>, ` +
            `inserted <strong>${inserted}</strong>.`;

        await loadMatches();


    } catch (error) {

        console.error(
            "Cricketive sync error:",
            error
        );


        message.textContent =
            `Sync failed: ${
                error?.message ||
                "Unknown error"
            }`;


    } finally {

        button.disabled = false;
        button.textContent =
            "SYNC MATCHES";

    }

}

/* =========================================================
   SPORTScore STATUS
   ========================================================= */

function normalizeSportScoreStatus(
    status
) {

    const value =
        String(
            status || ""
        )
            .trim()
            .toLowerCase();


    if (
        value === "live" ||
        value === "in_progress" ||
        value === "in progress"
    ) {

        return "Live";

    }


    if (
        value === "finished" ||
        value === "ended" ||
        value === "completed"
    ) {

        return "Finished";

    }


    return "Upcoming";

}


/* =========================================================
   TEAM KEY
   ========================================================= */

function makeTeamKey(
    team1,
    team2
) {

    if (
        !team1 ||
        !team2
    ) {

        return "";

    }


    return (
        String(team1)
            .trim()
            .toLowerCase()
        +
        "|" +
        String(team2)
            .trim()
            .toLowerCase()
    );

}


/* =========================================================
   URL NORMALIZATION
   ========================================================= */

function normalizeUrl(
    value
) {

    if (!value) {
        return "";
    }


    const url =
        String(value)
            .trim();


    if (
        url.startsWith("http")
    ) {

        return url.replace(
            /\/+$/,
            ""
        );

    }


    return (
        "https://sportscore.com" +
        (
            url.startsWith("/")
                ? url
                : `/${url}`
        )
    ).replace(
        /\/+$/,
        ""
    );

}


/* =========================================================
   CLEAN STALE LIVE MATCHES
   ========================================================= */

async function cleanStaleMatches() {

    const cutoff =
        new Date(
            Date.now() -
            24 * 60 * 60 * 1000
        ).toISOString();


    const { error } =
        await client
            .from("Matches")
            .update({
                status: "Finished"
            })
            .eq(
                "status",
                "Live"
            )
            .lt(
                "start_time",
                cutoff
            );


    if (error) {

        console.error(
            "Could not clean stale live matches:",
            error
        );

    }

}


/* =========================================================
   LOAD MATCHES
   ========================================================= */

function safeFallbackStatus(
    storedStatus
) {

    const status =
        normalizeSportScoreStatus(
            storedStatus
        );


    /*
     * Never display an old cached "Live" state when we do not
     * have a fresh SportScore confirmation.
     *
     * We deliberately do NOT invent Live from start_time.
     */

    if (
        status === "Live"
    ) {

        return "Finished";

    }


    return status;

}


async function loadMatches() {

    const liveContainer =
        document.getElementById(
            "liveMatches"
        );

    const upcomingContainer =
        document.getElementById(
            "upcomingMatches"
        );

    liveContainer.innerHTML =
        "Loading...";

    upcomingContainer.innerHTML =
        "Loading...";


    /*
     * Supabase is the persistent store for Cricketive.
     * SportScore is the CURRENT source of truth for status.
     *
     * We therefore:
     *
     * 1. Load all Cricketive matches.
     * 2. Fetch the latest SportScore feed.
     * 3. Match SportScore fixtures to Cricketive rows.
     * 4. Use SportScore status when a match is found.
     * 5. Fall back to the stored status if SportScore is
     *    temporarily unavailable.
     *
     * start_time is NOT used to declare a match Live.
     */


    const {
        data,
        error
    } = await client
        .from("Matches")
        .select("*")
        .order(
            "start_time",
            {
                ascending: true
            }
        );


    if (error) {

        const msg =
            `
                <p style="color:#ff6666;">
                    ${escapeHtml(
                        error.message
                    )}
                </p>
            `;

        liveContainer.innerHTML =
            msg;

        upcomingContainer.innerHTML =
            msg;

        return;

    }


    const storedMatches =
        (data || [])
            .filter(
                match =>
                    match.team1 &&
                    match.team2 &&
                    !isPlaceholder(
                        match.team1
                    ) &&
                    !isPlaceholder(
                        match.team2
                    )
            );


    /*
     * Fetch fresh SportScore status.
     */

    let sportScoreMatches = [];
    let sportScoreAvailable = false;


    try {

        const response =
            await fetch(
                "/api/cricket-matches?mode=matches",
                {
                    cache: "no-store"
                }
            );


        if (
            response.ok
        ) {

            const payload =
                await response.json();


            if (
                Array.isArray(
                    payload.matches
                )
            ) {

                sportScoreMatches =
                    payload.matches;

                sportScoreAvailable =
                    true;

            }

        }

    } catch (error) {

        console.warn(
            "SportScore status refresh failed. Using last known status.",
            error
        );

    }


    /*
     * Index the fresh SportScore feed.
     */

    const bySportScoreUrl =
        new Map();

    const byFixture =
        new Map();


    for (
        const source of
            sportScoreMatches
    ) {

        const team1 =
            String(
                source.home ||
                source.team1 ||
                ""
            ).trim();

        const team2 =
            String(
                source.away ||
                source.team2 ||
                ""
            ).trim();

        const sourceTime =
            source.time ||
            source.start_time ||
            source.match_time ||
            null;


        const sourceUrl =
            source.url
                ? normalizeUrl(
                    source.url
                )
                : "";


        if (
            sourceUrl
        ) {

            bySportScoreUrl.set(
                sourceUrl,
                source
            );

        }


        const fixtureKey =
            makeFixtureKey(
                team1,
                team2,
                sourceTime
            );


        if (
            fixtureKey
        ) {

            byFixture.set(
                fixtureKey,
                source
            );

        }

    }


    /*
     * Match each Cricketive row to the latest SportScore row.
     */

    const normalized =
        storedMatches.map(
            match => {

                const storedUrl =
                    match.sportscore_url
                        ? normalizeUrl(
                            match.sportscore_url
                        )
                        : "";


                const fixtureKey =
                    makeFixtureKey(
                        match.team1,
                        match.team2,
                        match.start_time ||
                            match.match_time
                    );


                const source =
                    (
                        storedUrl
                            ? bySportScoreUrl.get(
                                storedUrl
                            )
                            : null
                    ) ||
                    byFixture.get(
                        fixtureKey
                    ) ||
                    null;


                /*
                 * SportScore is authoritative when the fixture
                 * exists in the fresh feed.
                 *
                 * If SportScore is temporarily unavailable or
                 * the fixture is absent, retain the last stored
                 * status instead of inventing one from time.
                 */

                const currentStatus =
                    source
                        ? normalizeSportScoreStatus(
                            source.status
                        )
                        : safeFallbackStatus(
                            match.status
                        );


                return {

                    ...match,

                    source,

                    currentStatus

                };

            }
        );


    /*
     * Remove duplicate fixtures from the display.
     * Prefer the row containing a saved stream.
     */

    const uniqueMatches =
        new Map();


    for (
        const match of normalized
    ) {

        const fixtureKey =
            makeFixtureKey(
                match.team1,
                match.team2,
                match.start_time ||
                    match.match_time
            );


        if (!fixtureKey) {
            continue;
        }


        const previous =
            uniqueMatches.get(
                fixtureKey
            );


        if (!previous) {

            uniqueMatches.set(
                fixtureKey,
                match
            );

            continue;

        }


        const previousHasStream =
            Boolean(
                previous.embed_url
            );

        const currentHasStream =
            Boolean(
                match.embed_url
            );


        if (
            currentHasStream &&
            !previousHasStream
        ) {

            uniqueMatches.set(
                fixtureKey,
                match
            );

        }

    }


    const currentMatches =
        Array.from(
            uniqueMatches.values()
        );


    const liveMatches =
        currentMatches.filter(
            match =>
                match.currentStatus ===
                "Live"
        );


    const upcomingMatches =
        currentMatches.filter(
            match =>
                match.currentStatus ===
                "Upcoming"
        );


    const finishedMatches =
        currentMatches.filter(
            match =>
                match.currentStatus ===
                "Finished"
        );


    /*
     * The counters and rendered lists use the exact same
     * arrays.
     */

    const syncMessage =
        document.getElementById(
            "syncMessage"
        );


    if (
        syncMessage
    ) {

        const sourceLabel =
            sportScoreAvailable
                ? "Live status from SportScore."
                : "SportScore unavailable — stale Live statuses suppressed.";

        syncMessage.innerHTML =
            `Current schedule: ` +
            `<strong>${currentMatches.length}</strong> matches.` +
            `<br>🔴 Live: ${liveMatches.length}` +
            ` &nbsp;·&nbsp; 📅 Upcoming: ${upcomingMatches.length}` +
            ` &nbsp;·&nbsp; ✅ Finished: ${finishedMatches.length}` +
            `<br><small>${sourceLabel}</small>`;

    }


    renderMatchList(
        liveContainer,
        liveMatches,
        "live"
    );


    renderMatchList(
        upcomingContainer,
        upcomingMatches,
        "upcoming"
    );

}

/* =========================================================
   RENDER MATCH LIST
   ========================================================= */

function renderMatchList(
    container,
    matches,
    type
) {

    if (
        !matches.length
    ) {

        container.innerHTML =
            `
                <div class="empty">
                    No ${type} matches.
                </div>
            `;

        return;

    }


    container.innerHTML =
        "";


    matches.forEach(
        match => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "match";


            div.innerHTML = `

                <div class="match-header">

                    <div>

                        <div class="match-title">

                            ${escapeHtml(
                                match.title ||
                                `${match.team1} vs ${match.team2}`
                            )}

                        </div>


                        <div class="match-meta">

                            ${escapeHtml(
                                match.team1
                            )}

                            vs

                            ${escapeHtml(
                                match.team2
                            )}

                            ${
                                match.competition
                                    ? `
                                        <br>
                                        ${escapeHtml(
                                            match.competition
                                        )}
                                      `
                                    : ""
                            }


                            ${
                                match.start_time
                                    ? `
                                        <br>
                                        ${formatDate(
                                            match.start_time
                                        )}
                                      `
                                    : ""
                            }


                            ${
                                match.venue
                                    ? `
                                        <br>
                                        ${escapeHtml(
                                            match.venue
                                        )}
                                      `
                                    : ""
                            }

                        </div>


                        ${
                            match.api_match_id
                                ? `
                                    <div class="api-id">
                                        API ID:
                                        ${escapeHtml(
                                            match.api_match_id
                                        )}
                                    </div>
                                  `
                                : ""
                        }

                    </div>


                    <span
                        class="status ${
                            type === "live"
                                ? "badge-live"
                                : "badge-upcoming"
                        }"
                    >
                        ${escapeHtml(
                            match.currentStatus ||
                            match.status ||
                            "Upcoming"
                        )}
                    </span>

                </div>


                <!-- STREAMS -->

                <div class="stream-box">

                    <strong>
                        Streams
                    </strong>


                    <div
                        id="streams-${match.id}"
                        class="stream-list"
                    >
                        Loading streams...
                    </div>


                    <div class="toolbar">

                        <button
                            class="secondary"
                            onclick="addStreamForm(
                                '${match.id}'
                            )"
                        >
                            + ADD STREAM
                        </button>


                        ${
                            !match.api_match_id
                                ? `
                                    <button
                                        class="danger"
                                        onclick="deleteManualMatch(
                                            '${match.id}'
                                        )"
                                    >
                                        DELETE MANUAL MATCH
                                    </button>
                                  `
                                : ""
                        }

                    </div>


                    <div
                        id="add-stream-${match.id}"
                    ></div>

                </div>

            `;


            container.appendChild(
                div
            );


            loadStreams(
                match.id
            );

        }
    );

}


/* =========================================================
   DELETE MANUAL MATCH
   ========================================================= */

async function deleteManualMatch(
    matchId
) {

    const {
        data: match,
        error: fetchError
    } = await client
        .from("Matches")
        .select(
            "id, api_match_id, title"
        )
        .eq(
            "id",
            matchId
        )
        .single();


    if (fetchError) {

        alert(
            fetchError.message
        );

        return;

    }


    if (
        match.api_match_id
    ) {

        alert(
            "API-synced matches cannot be deleted manually."
        );

        return;

    }


    if (
        !confirm(
            `Delete manual match "${match.title}"?`
        )
    ) {

        return;

    }


    const {
        error
    } = await client
        .from("Matches")
        .delete()
        .eq(
            "id",
            matchId
        );


    if (error) {

        alert(
            error.message
        );

        return;

    }


    await loadMatches();

}


/* =========================================================
   LOAD STREAMS
   ========================================================= */

async function loadStreams(
    matchId
) {

    const container =
        document.getElementById(
            `streams-${matchId}`
        );


    if (!container) {
        return;
    }


    const {
        data,
        error
    } = await client
        .from("streams")
        .select("*")
        .eq(
            "match_id",
            matchId
        )
        .order(
            "created_at",
            {
                ascending: true
            }
        );


    if (error) {

        container.innerHTML =
            `
                <span style="color:#ff6666;">
                    ${escapeHtml(
                        error.message
                    )}
                </span>
            `;

        return;

    }


    if (
        !data ||
        !data.length
    ) {

        container.innerHTML =
            `
                <span style="color:#888;">
                    No streams added yet.
                </span>
            `;

        return;

    }


    container.innerHTML =
        data
            .map(
                stream => `

                    <div class="stream-row">

                        <select
                            id="lang-${stream.id}"
                        >

                            ${languageOption(
                                "English",
                                stream.language
                            )}

                            ${languageOption(
                                "Hindi",
                                stream.language
                            )}

                            ${languageOption(
                                "Telugu",
                                stream.language
                            )}

                            ${languageOption(
                                "Tamil",
                                stream.language
                            )}

                            ${languageOption(
                                "Malayalam",
                                stream.language
                            )}

                            ${languageOption(
                                "Kannada",
                                stream.language
                            )}

                            ${languageOption(
                                "Other",
                                stream.language
                            )}

                        </select>


                        <input
                            id="url-${stream.id}"
                            type="url"
                            value="${escapeHtml(
                                stream.embed_url
                            )}"
                            placeholder="https://..."
                        >


                        <input
                            id="name-${stream.id}"
                            type="text"
                            value="${escapeHtml(
                                stream.stream_name
                            )}"
                            placeholder="Stream name"
                        >


                        <div
                            class="toolbar"
                            style="margin:0;"
                        >

                            <button
                                class="secondary"
                                onclick="updateStream(
                                    '${stream.id}'
                                )"
                            >
                                SAVE
                            </button>


                            <button
                                class="danger"
                                onclick="deleteStream(
                                    '${stream.id}',
                                    '${matchId}'
                                )"
                            >
                                DELETE
                            </button>

                        </div>

                    </div>

                `
            )
            .join("");

}


/* =========================================================
   ADD STREAM FORM
   ========================================================= */

function addStreamForm(
    matchId
) {

    const container =
        document.getElementById(
            `add-stream-${matchId}`
        );


    container.innerHTML = `

        <div class="stream-row">

            <select
                id="new-lang-${matchId}"
            >

                ${languageOption(
                    "English",
                    "English"
                )}

                ${languageOption(
                    "Hindi",
                    ""
                )}

                ${languageOption(
                    "Telugu",
                    ""
                )}

                ${languageOption(
                    "Tamil",
                    ""
                )}

                ${languageOption(
                    "Malayalam",
                    ""
                )}

                ${languageOption(
                    "Kannada",
                    ""
                )}

                ${languageOption(
                    "Other",
                    ""
                )}

            </select>


            <input
                id="new-url-${matchId}"
                type="url"
                placeholder="https://your-embed-url..."
            >


            <input
                id="new-name-${matchId}"
                type="text"
                placeholder="Stream 1"
            >


            <button
                class="primary"
                style="margin-top:0;"
                onclick="createStream(
                    '${matchId}'
                )"
            >
                ADD
            </button>

        </div>

    `;

}


/* =========================================================
   CREATE STREAM
   ========================================================= */

async function createStream(
    matchId
) {

    const language =
        document
            .getElementById(
                `new-lang-${matchId}`
            )
            .value;


    const embed_url =
        document
            .getElementById(
                `new-url-${matchId}`
            )
            .value
            .trim();


    const stream_name =
        document
            .getElementById(
                `new-name-${matchId}`
            )
            .value
            .trim()
        || "Stream";


    if (!embed_url) {

        alert(
            "Enter a stream embed URL."
        );

        return;

    }


    const {
        error
    } = await client
        .from("streams")
        .insert([{

            match_id:
                matchId,

            language:
                language,

            stream_name:
                stream_name,

            embed_url:
                embed_url,

            active:
                true

        }]);


    if (error) {

        alert(
            error.message
        );

        return;

    }


    await loadStreams(
        matchId
    );


    document
        .getElementById(
            `add-stream-${matchId}`
        )
        .innerHTML = "";

}


/* =========================================================
   UPDATE STREAM
   ========================================================= */

async function updateStream(
    streamId
) {

    const language =
        document
            .getElementById(
                `lang-${streamId}`
            )
            .value;


    const embed_url =
        document
            .getElementById(
                `url-${streamId}`
            )
            .value
            .trim();


    const stream_name =
        document
            .getElementById(
                `name-${streamId}`
            )
            .value
            .trim()
        || "Stream";


    const {
        error
    } = await client
        .from("streams")
        .update({

            language,

            embed_url,

            stream_name

        })
        .eq(
            "id",
            streamId
        );


    if (error) {

        alert(
            error.message
        );

        return;

    }


    alert(
        "Stream updated."
    );

}


/* =========================================================
   DELETE STREAM
   ========================================================= */

async function deleteStream(
    streamId,
    matchId
) {

    if (
        !confirm(
            "Delete this stream?"
        )
    ) {

        return;

    }


    const {
        error
    } = await client
        .from("streams")
        .delete()
        .eq(
            "id",
            streamId
        );


    if (error) {

        alert(
            error.message
        );

        return;

    }


    await loadStreams(
        matchId
    );

}


/* =========================================================
   LANGUAGE OPTION
   ========================================================= */

function languageOption(
    value,
    selected
) {

    return `

        <option
            value="${escapeHtml(value)}"
            ${
                value === selected
                    ? "selected"
                    : ""
            }
        >
            ${escapeHtml(value)}
        </option>

    `;

}


/* =========================================================
   DATE FORMAT
   ========================================================= */

function formatDate(
    value
) {

    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return date.toLocaleString(
        [],
        {
            dateStyle:
                "medium",

            timeStyle:
                "short"
        }
    );

}


/* =========================================================
   PLACEHOLDER CHECK
   ========================================================= */

function isPlaceholder(
    value
) {

    if (!value) {
        return true;
    }


    return /^(tbc|tbd|to be confirmed|to be decided)$/i
        .test(
            String(value).trim()
        );

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   START
   ========================================================= */

checkSession();


</script>
