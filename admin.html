<script>


/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://qkzwzdyahwzcwtqgcbud.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_wgba0C-XWm2B6UA-d93Rhw_9aWXKMVC";

const client =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   LOGIN
   ========================================================= */

async function login() {

    const email =
        document
            .getElementById("email")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;

    const message =
        document
            .getElementById("loginMessage");

    if (!email || !password) {

        message.textContent =
            "Enter your email and password.";

        return;
    }

    message.textContent =
        "Signing in...";

    const { error } =
        await client.auth.signInWithPassword({
            email,
            password
        });

    if (error) {

        message.textContent =
            error.message;

        return;
    }

    showAdmin();

}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout() {

    await client.auth.signOut();

    document
        .getElementById("adminPanel")
        .style.display = "none";

    document
        .getElementById("loginPanel")
        .classList
        .remove("hidden");

}


/* =========================================================
   CHECK SESSION
   ========================================================= */

async function checkSession() {

    const { data } =
        await client.auth.getSession();

    if (data.session) {
        showAdmin();
    }

}


/* =========================================================
   SHOW ADMIN
   ========================================================= */

function showAdmin() {

    document
        .getElementById("loginPanel")
        .classList
        .add("hidden");

    document
        .getElementById("adminPanel")
        .style.display = "block";

    loadMatches();

}


/* =========================================================
   SYNC MATCHES
   ========================================================= */

async function syncMatches() {

    const message =
        document
            .getElementById("syncMessage");

    const button =
        document
            .getElementById("syncButton");

    message.textContent =
        "Syncing SportScore matches...";

    button.disabled = true;

    button.textContent =
        "SYNCING...";


    try {


        /* -----------------------------------------------
           Fetch SportScore matches
        ----------------------------------------------- */

        const response =
            await fetch(
                "/api/cricket-matches?mode=matches",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                `API HTTP ${response.status}: ${errorText}`
            );

        }


        const payload =
            await response.json();


        const matches =
            Array.isArray(
                payload.matches
            )
                ? payload.matches
                : [];


        if (!matches.length) {

            message.textContent =
                "SportScore returned 0 matches.";

            await loadMatches();

            return;

        }


        /* -----------------------------------------------
           Load existing Supabase matches
        ----------------------------------------------- */

        const {
            data: existingMatches,
            error: existingError
        } = await client
            .from("Matches")
            .select("*");


        if (existingError) {
            throw existingError;
        }


        const existing =
            existingMatches || [];


        /* -----------------------------------------------
           Build lookup maps
        ----------------------------------------------- */

        const bySportScoreUrl = {};
        const byTeams = {};
        const byApiMatchId = {};


        existing.forEach(
            match => {


                if (
                    match.sportscore_url
                ) {

                    bySportScoreUrl[
                        normalizeUrl(
                            match.sportscore_url
                        )
                    ] = match;

                }


                if (
                    match.api_match_id
                ) {

                    byApiMatchId[
                        String(
                            match.api_match_id
                        )
                    ] = match;

                }


                const key =
                    makeTeamKey(
                        match.team1,
                        match.team2
                    );


                if (key) {

                    byTeams[key] =
                        match;

                }

            }
        );


        /* -----------------------------------------------
           Build rows
        ----------------------------------------------- */

        const rows = [];


        for (
            const match of matches
        ) {


            const team1 =
                String(
                    match.home ??
                    match.team1 ??
                    ""
                ).trim();


            const team2 =
                String(
                    match.away ??
                    match.team2 ??
                    ""
                ).trim();


            const startTime =
                match.time ??
                match.start_time ??
                match.match_time ??
                null;


            if (
                !team1 ||
                !team2 ||
                !startTime
            ) {

                console.warn(
                    "Skipping invalid SportScore match:",
                    match
                );

                continue;

            }


            if (
                isPlaceholder(team1) ||
                isPlaceholder(team2)
            ) {

                continue;

            }


            /* -------------------------------------------
               SportScore URL
            ------------------------------------------- */

            const rawUrl =
                match.url ??
                match.sportscore_url ??
                null;


            const sportscoreUrl =
                rawUrl
                    ? normalizeUrl(rawUrl)
                    : null;


            /* -------------------------------------------
               Stable SportScore identifier
            ------------------------------------------- */

            const apiMatchId =
                sportscoreUrl
                    ? `sportscore:${sportscoreUrl}`
                    : `sportscore:${makeTeamKey(
                        team1,
                        team2
                    )}`;


            /* -------------------------------------------
               Find existing record
            ------------------------------------------- */

            let existingMatch =
                null;


            /*
             * 1. Match by API ID
             */

            existingMatch =
                byApiMatchId[
                    apiMatchId
                ] || null;


            /*
             * 2. Match by SportScore URL
             */

            if (
                !existingMatch &&
                sportscoreUrl
            ) {

                existingMatch =
                    bySportScoreUrl[
                        sportscoreUrl
                    ] || null;

            }


            /*
             * 3. Match by team names
             */

            if (
                !existingMatch
            ) {

                const teamKey =
                    makeTeamKey(
                        team1,
                        team2
                    );


                if (teamKey) {

                    existingMatch =
                        byTeams[
                            teamKey
                        ] || null;

                }

            }


            /* -------------------------------------------
               Build row
            ------------------------------------------- */

            const row = {

                api_match_id:
                    apiMatchId,

                title:
                    `${team1} vs ${team2}`,

                team1:
                    team1,

                team2:
                    team2,

                competition:
                    match.competition ||
                    "Cricket",

                match_time:
                    startTime,

                start_time:
                    startTime,

                venue:
                    match.venue ||
                    "",

                status:
                    getCurrentMatchStatus(
                        match.status,
                        match.time,
                        match.status_text
                    ),

                /*
                 * Preserve existing embed URL.
                 */

                embed_url:
                    existingMatch?.embed_url ||
                    "",

                team1_logo:
                    match.home_logo ||
                    match.team1_logo ||
                    "",

                team2_logo:
                    match.away_logo ||
                    match.team2_logo ||
                    "",

                sportscore_url:
                    sportscoreUrl

            };


            /* -------------------------------------------
               Preserve existing UUID
            ------------------------------------------- */

            if (
                existingMatch &&
                existingMatch.id
            ) {

                row.id =
                    existingMatch.id;

            }


            rows.push(row);

        }


        if (!rows.length) {

            message.textContent =
                `SportScore returned ${matches.length} matches, but none were valid.`;

            await loadMatches();

            return;

        }


        /* -----------------------------------------------
           Separate existing vs new
        ----------------------------------------------- */

        const existingRows =
            rows.filter(
                row =>
                    Boolean(row.id)
            );


        const newRows =
            rows.filter(
                row =>
                    !row.id
            );


        /* -----------------------------------------------
           UPDATE EXISTING MATCHES
        ----------------------------------------------- */

        if (
            existingRows.length
        ) {

            const {
                error: updateError
            } = await client
                .from("Matches")
                .upsert(
                    existingRows,
                    {
                        onConflict: "id"
                    }
                );


            if (updateError) {
                throw updateError;
            }

        }


        /* -----------------------------------------------
           INSERT NEW MATCHES
        ----------------------------------------------- */

        if (
            newRows.length
        ) {

            /*
             * Insert individually.
             *
             * If a duplicate somehow appears,
             * skip it and continue syncing.
             */

            for (
                const row of newRows
            ) {

                const {
                    error: insertError
                } = await client
                    .from("Matches")
                    .insert(row);


                if (
                    insertError
                ) {

                    /*
                     * PostgreSQL duplicate-key code.
                     */

                    if (
                        insertError.code === "23505"
                    ) {

                        console.warn(
                            "Duplicate match skipped:",
                            row.api_match_id
                        );

                        continue;

                    }


                    throw insertError;

                }

            }

        }


        /* -----------------------------------------------
           Result
        ----------------------------------------------- */

        const liveCount =
            rows.filter(
                match =>
                    match.status === "Live"
            ).length;


        const upcomingCount =
            rows.filter(
                match =>
                    match.status === "Upcoming"
            ).length;


        const finishedCount =
            rows.filter(
                match =>
                    match.status === "Finished"
            ).length;


        message.innerHTML =
            `Synced <strong>${rows.length}</strong> matches.` +
            `<br>🔴 Live: ${liveCount}` +
            ` &nbsp;·&nbsp; 📅 Upcoming: ${upcomingCount}` +
            ` &nbsp;·&nbsp; ✅ Finished: ${finishedCount}`;


        await loadMatches();


    } catch (
        error
    ) {


        console.error(
            "SportScore sync error:",
            error
        );


        message.textContent =
            `Sync failed: ${
                error.message ||
                String(error)
            }`;


    } finally {


        button.disabled =
            false;


        button.textContent =
            "SYNC MATCHES";

    }

}


/* =========================================================
   CURRENT MATCH STATUS
   ========================================================= */

/*
 * IMPORTANT:
 * The database status is NOT trusted for display.
 *
 * Every time the Admin page renders matches, the status is
 * calculated from the stored start_time and the current clock.
 *
 * Rules:
 *
 *   Explicit finished status       -> Finished
 *   Start time in the future       -> Upcoming
 *   Start time passed <= 6 hours   -> Live
 *   Start time passed > 6 hours    -> Finished
 *
 * This prevents yesterday's matches from remaining Live.
 */

function getCurrentMatchStatus(
    storedStatus,
    startTime,
    statusText = ""
) {

    const stored =
        String(
            storedStatus || ""
        )
            .trim()
            .toLowerCase();

    const text =
        String(
            statusText || ""
        )
            .trim()
            .toLowerCase();


    /* -----------------------------------------------------
       Parse start time
       ----------------------------------------------------- */

    const start =
        startTime
            ? new Date(startTime)
            : null;


    const hasValidStart =
        start &&
        !Number.isNaN(
            start.getTime()
        );


    /*
     * If we have a valid timestamp, it is the source of
     * truth for the Admin display.
     */

    if (
        hasValidStart
    ) {

        const elapsedHours =
            (
                Date.now() -
                start.getTime()
            ) /
            (1000 * 60 * 60);


        /*
         * Future match.
         */

        if (
            elapsedHours < 0
        ) {

            return "Upcoming";

        }


        /*
         * Match started within the last 6 hours.
         */

        if (
            elapsedHours <= 6
        ) {

            return "Live";

        }


        /*
         * Older than 6 hours.
         *
         * Do not allow an old stored "Live" value to
         * keep the match in the Live section.
         */

        return "Finished";

    }


    /* -----------------------------------------------------
       No valid start_time
       ----------------------------------------------------- */

    /*
     * If timestamp data is unavailable, fall back to the
     * explicit SportScore/database status.
     */

    if (
        stored === "live" ||
        stored === "in_progress" ||
        stored === "in progress" ||
        stored === "started" ||
        stored === "playing" ||
        stored === "ongoing" ||
        text === "live" ||
        text === "in progress" ||
        text === "started" ||
        text === "playing" ||
        text === "ongoing"
    ) {

        return "Live";

    }


    if (
        stored === "finished" ||
        stored === "ended" ||
        stored === "completed" ||
        stored === "complete" ||
        stored === "ft" ||
        text === "finished" ||
        text === "ended" ||
        text === "completed" ||
        text === "complete"
    ) {

        return "Finished";

    }


    return "Upcoming";

}


/* =========================================================
   TEAM KEY
   ========================================================= */

function makeTeamKey(
    team1,
    team2
) {

    if (
        !team1 ||
        !team2
    ) {

        return "";

    }


    return (
        String(team1)
            .trim()
            .toLowerCase()
        +
        "|" +
        String(team2)
            .trim()
            .toLowerCase()
    );

}


/* =========================================================
   URL NORMALIZATION
   ========================================================= */

function normalizeUrl(
    value
) {

    if (!value) {
        return "";
    }


    const url =
        String(value)
            .trim();


    if (
        url.startsWith("http")
    ) {

        return url.replace(
            /\/+$/,
            ""
        );

    }


    return (
        "https://sportscore.com" +
        (
            url.startsWith("/")
                ? url
                : `/${url}`
        )
    ).replace(
        /\/+$/,
        ""
    );

}


/* =========================================================
   CLEAN STALE LIVE MATCHES
   ========================================================= */

async function cleanStaleMatches() {

    /*
     * No database status mutation is required anymore.
     * Current display status is calculated from start_time.
     */

    return;

}


/* =========================================================
   LOAD MATCHES
   ========================================================= */

async function loadMatches() {

    const liveContainer =
        document.getElementById(
            "liveMatches"
        );


    const upcomingContainer =
        document.getElementById(
            "upcomingMatches"
        );


    liveContainer.innerHTML =
        "Loading...";

    upcomingContainer.innerHTML =
        "Loading...";


    await cleanStaleMatches();


    const {
        data,
        error
    } = await client
        .from("Matches")
        .select("*")
        .in(
            "status",
            [
                "Live",
                "Upcoming"
            ]
        )
        .order(
            "start_time",
            {
                ascending: true
            }
        );


    if (error) {

        const msg =
            `
                <p style="color:#ff6666;">
                    ${escapeHtml(
                        error.message
                    )}
                </p>
            `;


        liveContainer.innerHTML =
            msg;

        upcomingContainer.innerHTML =
            msg;

        return;

    }


    /*
     * Calculate CURRENT status for every match.
     *
     * Never use the stored status to decide which section
     * the match belongs to.
     */

    const currentMatches =
        (data || [])
            .filter(
                match =>
                    match.team1 &&
                    match.team2 &&
                    !isPlaceholder(
                        match.team1
                    ) &&
                    !isPlaceholder(
                        match.team2
                    )
            )
            .map(
                match => ({

                    ...match,

                    currentStatus:
                        getCurrentMatchStatus(
                            match.status,
                            match.start_time,
                            match.status_text
                        )

                })
            );


    const liveMatches =
        currentMatches.filter(
            match =>
                match.currentStatus === "Live"
        );


    const upcomingMatches =
        currentMatches.filter(
            match =>
                match.currentStatus === "Upcoming"
        );


    const finishedMatches =
        currentMatches.filter(
            match =>
                match.currentStatus === "Finished"
        );


    /*
     * Only Live and Upcoming are rendered in the active
     * schedule. Finished matches remain available in the
     * database and can be shown by other pages if needed.
     */



                    return (
                        match.team1 &&
                        match.team2 &&
                        !isPlaceholder(
                            match.team1
                        ) &&
                        !isPlaceholder(
                            match.team2
                        )
                    );

                }
            );


    const live =
        validMatches.filter(
            match =>
                match.currentStatus === "Live"
        );


    const upcoming =
        validMatches.filter(
            match =>
                match.currentStatus === "Upcoming"
        );


    renderMatchList(
        liveContainer,
        live,
        "live"
    );


    renderMatchList(
        upcomingContainer,
        upcoming,
        "upcoming"
    );

}


/* =========================================================
   RENDER MATCH LIST
   ========================================================= */

function renderMatchList(
    container,
    matches,
    type
) {

    if (
        !matches.length
    ) {

        container.innerHTML =
            `
                <div class="empty">
                    No ${type} matches.
                </div>
            `;

        return;

    }


    container.innerHTML =
        "";


    matches.forEach(
        match => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "match";


            div.innerHTML = `

                <div class="match-header">

                    <div>

                        <div class="match-title">

                            ${escapeHtml(
                                match.title ||
                                `${match.team1} vs ${match.team2}`
                            )}

                        </div>


                        <div class="match-meta">

                            ${escapeHtml(
                                match.team1
                            )}

                            vs

                            ${escapeHtml(
                                match.team2
                            )}

                            ${
                                match.competition
                                    ? `
                                        <br>
                                        ${escapeHtml(
                                            match.competition
                                        )}
                                      `
                                    : ""
                            }


                            ${
                                match.start_time
                                    ? `
                                        <br>
                                        ${formatDate(
                                            match.start_time
                                        )}
                                      `
                                    : ""
                            }


                            ${
                                match.venue
                                    ? `
                                        <br>
                                        ${escapeHtml(
                                            match.venue
                                        )}
                                      `
                                    : ""
                            }

                        </div>


                        ${
                            match.api_match_id
                                ? `
                                    <div class="api-id">
                                        API ID:
                                        ${escapeHtml(
                                            match.api_match_id
                                        )}
                                    </div>
                                  `
                                : ""
                        }

                    </div>


                    <span
                        class="status ${
                            type === "live"
                                ? "badge-live"
                                : "badge-upcoming"
                        }"
                    >
                        ${escapeHtml(
                            match.status
                        )}
                    </span>

                </div>


                <!-- STREAMS -->

                <div class="stream-box">

                    <strong>
                        Streams
                    </strong>


                    <div
                        id="streams-${match.id}"
                        class="stream-list"
                    >
                        Loading streams...
                    </div>


                    <div class="toolbar">

                        <button
                            class="secondary"
                            onclick="addStreamForm(
                                '${match.id}'
                            )"
                        >
                            + ADD STREAM
                        </button>


                        ${
                            !match.api_match_id
                                ? `
                                    <button
                                        class="danger"
                                        onclick="deleteManualMatch(
                                            '${match.id}'
                                        )"
                                    >
                                        DELETE MANUAL MATCH
                                    </button>
                                  `
                                : ""
                        }

                    </div>


                    <div
                        id="add-stream-${match.id}"
                    ></div>

                </div>

            `;


            container.appendChild(
                div
            );


            loadStreams(
                match.id
            );

        }
    );

}


/* =========================================================
   DELETE MANUAL MATCH
   ========================================================= */

async function deleteManualMatch(
    matchId
) {

    const {
        data: match,
        error: fetchError
    } = await client
        .from("Matches")
        .select(
            "id, api_match_id, title"
        )
        .eq(
            "id",
            matchId
        )
        .single();


    if (fetchError) {

        alert(
            fetchError.message
        );

        return;

    }


    if (
        match.api_match_id
    ) {

        alert(
            "API-synced matches cannot be deleted manually."
        );

        return;

    }


    if (
        !confirm(
            `Delete manual match "${match.title}"?`
        )
    ) {

        return;

    }


    const {
        error
    } = await client
        .from("Matches")
        .delete()
        .eq(
            "id",
            matchId
        );


    if (error) {

        alert(
            error.message
        );

        return;

    }


    await loadMatches();

}


/* =========================================================
   LOAD STREAMS
   ========================================================= */

async function loadStreams(
    matchId
) {

    const container =
        document.getElementById(
            `streams-${matchId}`
        );


    if (!container) {
        return;
    }


    const {
        data,
        error
    } = await client
        .from("streams")
        .select("*")
        .eq(
            "match_id",
            matchId
        )
        .order(
            "created_at",
            {
                ascending: true
            }
        );


    if (error) {

        container.innerHTML =
            `
                <span style="color:#ff6666;">
                    ${escapeHtml(
                        error.message
                    )}
                </span>
            `;

        return;

    }


    if (
        !data ||
        !data.length
    ) {

        container.innerHTML =
            `
                <span style="color:#888;">
                    No streams added yet.
                </span>
            `;

        return;

    }


    container.innerHTML =
        data
            .map(
                stream => `

                    <div class="stream-row">

                        <select
                            id="lang-${stream.id}"
                        >

                            ${languageOption(
                                "English",
                                stream.language
                            )}

                            ${languageOption(
                                "Hindi",
                                stream.language
                            )}

                            ${languageOption(
                                "Telugu",
                                stream.language
                            )}

                            ${languageOption(
                                "Tamil",
                                stream.language
                            )}

                            ${languageOption(
                                "Malayalam",
                                stream.language
                            )}

                            ${languageOption(
                                "Kannada",
                                stream.language
                            )}

                            ${languageOption(
                                "Other",
                                stream.language
                            )}

                        </select>


                        <input
                            id="url-${stream.id}"
                            type="url"
                            value="${escapeHtml(
                                stream.embed_url
                            )}"
                            placeholder="https://..."
                        >


                        <input
                            id="name-${stream.id}"
                            type="text"
                            value="${escapeHtml(
                                stream.stream_name
                            )}"
                            placeholder="Stream name"
                        >


                        <div
                            class="toolbar"
                            style="margin:0;"
                        >

                            <button
                                class="secondary"
                                onclick="updateStream(
                                    '${stream.id}'
                                )"
                            >
                                SAVE
                            </button>


                            <button
                                class="danger"
                                onclick="deleteStream(
                                    '${stream.id}',
                                    '${matchId}'
                                )"
                            >
                                DELETE
                            </button>

                        </div>

                    </div>

                `
            )
            .join("");

}


/* =========================================================
   ADD STREAM FORM
   ========================================================= */

function addStreamForm(
    matchId
) {

    const container =
        document.getElementById(
            `add-stream-${matchId}`
        );


    container.innerHTML = `

        <div class="stream-row">

            <select
                id="new-lang-${matchId}"
            >

                ${languageOption(
                    "English",
                    "English"
                )}

                ${languageOption(
                    "Hindi",
                    ""
                )}

                ${languageOption(
                    "Telugu",
                    ""
                )}

                ${languageOption(
                    "Tamil",
                    ""
                )}

                ${languageOption(
                    "Malayalam",
                    ""
                )}

                ${languageOption(
                    "Kannada",
                    ""
                )}

                ${languageOption(
                    "Other",
                    ""
                )}

            </select>


            <input
                id="new-url-${matchId}"
                type="url"
                placeholder="https://your-embed-url..."
            >


            <input
                id="new-name-${matchId}"
                type="text"
                placeholder="Stream 1"
            >


            <button
                class="primary"
                style="margin-top:0;"
                onclick="createStream(
                    '${matchId}'
                )"
            >
                ADD
            </button>

        </div>

    `;

}


/* =========================================================
   CREATE STREAM
   ========================================================= */

async function createStream(
    matchId
) {

    const language =
        document
            .getElementById(
                `new-lang-${matchId}`
            )
            .value;


    const embed_url =
        document
            .getElementById(
                `new-url-${matchId}`
            )
            .value
            .trim();


    const stream_name =
        document
            .getElementById(
                `new-name-${matchId}`
            )
            .value
            .trim()
        || "Stream";


    if (!embed_url) {

        alert(
            "Enter a stream embed URL."
        );

        return;

    }


    const {
        error
    } = await client
        .from("streams")
        .insert([{

            match_id:
                matchId,

            language:
                language,

            stream_name:
                stream_name,

            embed_url:
                embed_url,

            active:
                true

        }]);


    if (error) {

        alert(
            error.message
        );

        return;

    }


    await loadStreams(
        matchId
    );


    document
        .getElementById(
            `add-stream-${matchId}`
        )
        .innerHTML = "";

}


/* =========================================================
   UPDATE STREAM
   ========================================================= */

async function updateStream(
    streamId
) {

    const language =
        document
            .getElementById(
                `lang-${streamId}`
            )
            .value;


    const embed_url =
        document
            .getElementById(
                `url-${streamId}`
            )
            .value
            .trim();


    const stream_name =
        document
            .getElementById(
                `name-${streamId}`
            )
            .value
            .trim()
        || "Stream";


    const {
        error
    } = await client
        .from("streams")
        .update({

            language,

            embed_url,

            stream_name

        })
        .eq(
            "id",
            streamId
        );


    if (error) {

        alert(
            error.message
        );

        return;

    }


    alert(
        "Stream updated."
    );

}


/* =========================================================
   DELETE STREAM
   ========================================================= */

async function deleteStream(
    streamId,
    matchId
) {

    if (
        !confirm(
            "Delete this stream?"
        )
    ) {

        return;

    }


    const {
        error
    } = await client
        .from("streams")
        .delete()
        .eq(
            "id",
            streamId
        );


    if (error) {

        alert(
            error.message
        );

        return;

    }


    await loadStreams(
        matchId
    );

}


/* =========================================================
   LANGUAGE OPTION
   ========================================================= */

function languageOption(
    value,
    selected
) {

    return `

        <option
            value="${escapeHtml(value)}"
            ${
                value === selected
                    ? "selected"
                    : ""
            }
        >
            ${escapeHtml(value)}
        </option>

    `;

}


/* =========================================================
   DATE FORMAT
   ========================================================= */

function formatDate(
    value
) {

    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return date.toLocaleString(
        [],
        {
            dateStyle:
                "medium",

            timeStyle:
                "short"
        }
    );

}


/* =========================================================
   PLACEHOLDER CHECK
   ========================================================= */

function isPlaceholder(
    value
) {

    if (!value) {
        return true;
    }


    return /^(tbc|tbd|to be confirmed|to be decided)$/i
        .test(
            String(value).trim()
        );

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

   START
   ========================================================= */

checkSession();
