<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cricketive Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #070707;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: auto;
            padding: 30px 18px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
        }

        button {
            border: none;
            cursor: pointer;
        }

        .logout {
            padding: 9px 14px;
            border-radius: 7px;
            background: #222;
            color: white;
        }

        .card {
            background: #111;
            border: 1px solid #242424;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-size: 13px;
            color: #bbb;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            background: #080808;
            color: white;
            border: 1px solid #333;
            border-radius: 7px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #5865f2;
        }

        .primary {
            margin-top: 20px;
            padding: 12px 18px;
            background: #5865f2;
            color: white;
            border-radius: 7px;
            font-weight: bold;
        }

        .primary:hover {
            background: #4752c4;
        }

        .secondary {
            padding: 9px 13px;
            background: #222;
            color: white;
            border-radius: 6px;
        }

        .danger {
            padding: 9px 13px;
            background: #b42323;
            color: white;
            border-radius: 6px;
        }

        .match {
            background: #0a0a0a;
            border: 1px solid #292929;
            border-radius: 10px;
            padding: 18px;
            margin-top: 12px;
        }

        .match-title {
            font-size: 17px;
            font-weight: bold;
        }

        .match-meta {
            color: #999;
            font-size: 13px;
            margin-top: 7px;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 9px;
            border-radius: 20px;
            background: #222;
            font-size: 11px;
        }

        .message {
            margin-top: 12px;
            font-size: 13px;
        }

        #adminPanel {
            display: none;
        }

        #loginPanel {
            max-width: 450px;
            margin: 80px auto;
        }

        .hidden {
            display: none !important;
        }


        .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
        .match-header { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
        .stream-box { margin-top:16px; padding-top:14px; border-top:1px solid #292929; }
        .stream-row { display:grid; grid-template-columns:120px 1fr 150px auto; gap:8px; align-items:center; margin-top:8px; }
        .stream-row input, .stream-row select { margin:0; }
        .stream-list { margin-top:12px; }
        .empty { color:#888; padding:10px 0; }
        .badge-live { background:#8b1e1e; }
        .badge-upcoming { background:#234d2d; }
        .sync-note { color:#999; font-size:12px; line-height:1.5; margin-top:8px; }
        @media (max-width:700px) {
            .stream-row { grid-template-columns:1fr; }
            .match-header { flex-direction:column; }
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px 12px;
            }

            .header {
                align-items: flex-start;
            }

            .logo {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LOGIN -->

    <div id="loginPanel" class="card">

        <h2>🏏 Cricketive Admin</h2>

        <p style="color:#999;font-size:13px;">
            Sign in to manage live cricket matches.
        </p>

        <label>Email</label>

        <input
            id="email"
            type="email"
            placeholder="Admin email"
        >

        <label>Password</label>

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

        <button
            class="primary"
            onclick="login()">
            LOGIN
        </button>

        <div
            id="loginMessage"
            class="message">
        </div>

    </div>


    <!-- ADMIN PANEL -->

    <div id="adminPanel">

        <div class="header">

            <div class="logo">
                CRICKETIVE 🏏
            </div>

            <button
                class="logout"
                onclick="logout()">
                LOGOUT
            </button>

        </div>


        <!-- MATCH SYNC -->
        <div class="card">
            <h2>Match Schedule</h2>
            <p class="sync-note">Matches are loaded from Cricket Data. You only need to add stream links.</p>
            <button class="primary" onclick="syncMatches()">SYNC MATCHES</button>
            <div id="syncMessage" class="message"></div>
        </div>

        <div class="card">
            <h2>🔴 Live Matches</h2>
            <div id="liveMatches">Loading...</div>
        </div>

        <div class="card">
            <h2>📅 Upcoming Matches</h2>
            <div id="upcomingMatches">Loading...</div>
        </div>

    </div>

</div>


<script>
    const SUPABASE_URL = "https://qkzwzdyahwzcwtqgcbud.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_wgba0C-XWm2B6UA-d93Rhw_9aWXKMVC";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function login() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const message = document.getElementById("loginMessage");

        if (!email || !password) {
            message.textContent = "Enter your email and password.";
            return;
        }

        message.textContent = "Signing in...";
        const { error } = await client.auth.signInWithPassword({ email, password });

        if (error) {
            message.textContent = error.message;
            return;
        }
        showAdmin();
    }

    async function logout() {
        await client.auth.signOut();
        document.getElementById("adminPanel").style.display = "none";
        document.getElementById("loginPanel").classList.remove("hidden");
    }

    async function checkSession() {
        const { data } = await client.auth.getSession();
        if (data.session) showAdmin();
    }

    function showAdmin() {
        document.getElementById("loginPanel").classList.add("hidden");
        document.getElementById("adminPanel").style.display = "block";
        loadMatches();
    }

    async function syncMatches() {
        const message = document.getElementById("syncMessage");
        message.textContent = "Syncing matches...";

        try {
            const response = await fetch("/.netlify/functions/cricket-matches");
            const payload = await response.json();

            if (!response.ok) throw new Error(payload.error || "Could not fetch matches.");

            const matches = payload.matches || [];
            if (!matches.length) {
                message.textContent = "No live or upcoming matches were returned.";
                await loadMatches();
                return;
            }

            const rows = matches.map(m => ({
                api_match_id: m.id,
                title: m.name || `${m.teams?.[0] || "Team 1"} vs ${m.teams?.[1] || "Team 2"}`,
                team1: m.teams?.[0] || "",
                team2: m.teams?.[1] || "",
                competition: m.series_name || "",
                match_time: m.dateTimeGMT ? new Date(m.dateTimeGMT).toLocaleString() : "",
                start_time: m.dateTimeGMT || null,
                venue: m.venue || "",
                team1_logo: m.teamInfo?.[0]?.img || "",
                team2_logo: m.teamInfo?.[1]?.img || "",
                status: m.matchEnded ? "Finished" : (m.matchStarted ? "Live" : "Upcoming"),
                embed_url: ""
            }));

            const { error } = await client.from("Matches").upsert(rows, { onConflict: "api_match_id" });
            if (error) throw error;

            message.textContent = `Synced ${rows.length} match${rows.length === 1 ? "" : "es"}.`;
            await loadMatches();
        } catch (error) {
            console.error(error);
            message.textContent = `Sync failed: ${error.message}`;
        }
    }

    async function loadMatches() {
        const liveContainer = document.getElementById("liveMatches");
        const upcomingContainer = document.getElementById("upcomingMatches");
        liveContainer.innerHTML = "Loading...";
        upcomingContainer.innerHTML = "Loading...";

        const { data, error } = await client
            .from("Matches")
            .select("*")
            .in("status", ["Live", "Upcoming"])
            .order("start_time", { ascending: true });

        if (error) {
            const msg = `<p style="color:#ff6666;">${escapeHtml(error.message)}</p>`;
            liveContainer.innerHTML = msg;
            upcomingContainer.innerHTML = msg;
            return;
        }

        const live = (data || []).filter(m => m.status === "Live");
        const upcoming = (data || []).filter(m => m.status === "Upcoming");

        renderMatchList(liveContainer, live, "live");
        renderMatchList(upcomingContainer, upcoming, "upcoming");
    }

    function renderMatchList(container, matches, type) {
        if (!matches.length) {
            container.innerHTML = `<div class="empty">No ${type} matches.</div>`;
            return;
        }

        container.innerHTML = "";
        matches.forEach(match => {
            const div = document.createElement("div");
            div.className = "match";

            div.innerHTML = `
                <div class="match-header">
                    <div>
                        <div class="match-title">${escapeHtml(match.title)}</div>
                        <div class="match-meta">
                            ${escapeHtml(match.team1)} vs ${escapeHtml(match.team2)}
                            ${match.competition ? `<br>${escapeHtml(match.competition)}` : ""}
                            ${match.start_time ? `<br>${formatDate(match.start_time)}` : ""}
                            ${match.venue ? `<br>${escapeHtml(match.venue)}` : ""}
                        </div>
                    </div>
                    <span class="status ${type === "live" ? "badge-live" : "badge-upcoming"}">
                        ${escapeHtml(match.status)}
                    </span>
                </div>

                <div class="stream-box">
                    <strong>Streams</strong>
                    <div id="streams-${match.id}" class="stream-list">Loading streams...</div>
                    <div class="toolbar">
                        <button class="secondary" onclick="addStreamForm('${match.id}')">+ ADD STREAM</button>
                        ${!match.api_match_id ? `<button class="danger" onclick="deleteManualMatch('${match.id}')">DELETE MANUAL MATCH</button>` : ""}
                    </div>
                    <div id="add-stream-${match.id}"></div>
                </div>
            `;

            container.appendChild(div);
            loadStreams(match.id);
        });
    }

    async function deleteManualMatch(matchId) {
        const { data: match, error: fetchError } = await client
            .from("Matches")
            .select("id, api_match_id, title")
            .eq("id", matchId)
            .single();

        if (fetchError) {
            alert(fetchError.message);
            return;
        }

        if (match.api_match_id) {
            alert("API-synced matches cannot be deleted manually.");
            return;
        }

        if (!confirm(`Delete manual match \"${match.title}\"?`)) return;

        const { error } = await client
            .from("Matches")
            .delete()
            .eq("id", matchId);

        if (error) {
            alert(error.message);
            return;
        }

        await loadMatches();
    }

    async function loadStreams(matchId) {
        const container = document.getElementById(`streams-${matchId}`);
        if (!container) return;

        const { data, error } = await client
            .from("streams")
            .select("*")
            .eq("match_id", matchId)
            .order("created_at", { ascending: true });

        if (error) {
            container.innerHTML = `<span style="color:#ff6666;">${escapeHtml(error.message)}</span>`;
            return;
        }

        if (!data || !data.length) {
            container.innerHTML = `<span style="color:#888;">No streams added yet.</span>`;
            return;
        }

        container.innerHTML = data.map(stream => `
            <div class="stream-row">
                <select id="lang-${stream.id}">
                    ${languageOption("English", stream.language)}
                    ${languageOption("Hindi", stream.language)}
                    ${languageOption("Telugu", stream.language)}
                    ${languageOption("Tamil", stream.language)}
                    ${languageOption("Malayalam", stream.language)}
                    ${languageOption("Kannada", stream.language)}
                    ${languageOption("Other", stream.language)}
                </select>
                <input id="url-${stream.id}" type="url" value="${escapeHtml(stream.embed_url)}" placeholder="https://...">
                <input id="name-${stream.id}" type="text" value="${escapeHtml(stream.stream_name)}" placeholder="Stream name">
                <div class="toolbar" style="margin:0;">
                    <button class="secondary" onclick="updateStream('${stream.id}')">SAVE</button>
                    <button class="danger" onclick="deleteStream('${stream.id}', '${matchId}')">DELETE</button>
                </div>
            </div>
        `).join("");
    }

    function addStreamForm(matchId) {
        const container = document.getElementById(`add-stream-${matchId}`);
        container.innerHTML = `
            <div class="stream-row">
                <select id="new-lang-${matchId}">
                    ${languageOption("English", "English")}
                    ${languageOption("Hindi", "")}
                    ${languageOption("Telugu", "")}
                    ${languageOption("Tamil", "")}
                    ${languageOption("Malayalam", "")}
                    ${languageOption("Kannada", "")}
                    ${languageOption("Other", "")}
                </select>
                <input id="new-url-${matchId}" type="url" placeholder="https://your-embed-url...">
                <input id="new-name-${matchId}" type="text" placeholder="Stream 1">
                <button class="primary" style="margin-top:0;" onclick="createStream('${matchId}')">ADD</button>
            </div>
        `;
    }

    async function createStream(matchId) {
        const language = document.getElementById(`new-lang-${matchId}`).value;
        const embed_url = document.getElementById(`new-url-${matchId}`).value.trim();
        const stream_name = document.getElementById(`new-name-${matchId}`).value.trim() || "Stream";

        if (!embed_url) {
            alert("Enter a stream embed URL.");
            return;
        }

        const { error } = await client.from("streams").insert([{
            match_id: matchId,
            language,
            stream_name,
            embed_url,
            active: true
        }]);

        if (error) {
            alert(error.message);
            return;
        }

        await loadStreams(matchId);
        document.getElementById(`add-stream-${matchId}`).innerHTML = "";
    }

    async function updateStream(streamId) {
        const language = document.getElementById(`lang-${streamId}`).value;
        const embed_url = document.getElementById(`url-${streamId}`).value.trim();
        const stream_name = document.getElementById(`name-${streamId}`).value.trim() || "Stream";

        const { error } = await client.from("streams")
            .update({ language, embed_url, stream_name })
            .eq("id", streamId);

        if (error) {
            alert(error.message);
            return;
        }

        alert("Stream updated.");
    }

    async function deleteStream(streamId, matchId) {
        if (!confirm("Delete this stream?")) return;

        const { error } = await client.from("streams").delete().eq("id", streamId);
        if (error) {
            alert(error.message);
            return;
        }

        await loadStreams(matchId);
    }

    function languageOption(value, selected) {
        return `<option value="${value}" ${value === selected ? "selected" : ""}>${value}</option>`;
    }

    function formatDate(value) {
        const date = new Date(value);
        return date.toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    checkSession();
</script>

</body>
</html>
