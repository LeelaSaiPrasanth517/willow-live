<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cricketive Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #070707;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: auto;
            padding: 30px 18px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
        }

        button {
            border: none;
            cursor: pointer;
        }

        .logout {
            padding: 9px 14px;
            border-radius: 7px;
            background: #222;
            color: white;
        }

        .card {
            background: #111;
            border: 1px solid #242424;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-size: 13px;
            color: #bbb;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            background: #080808;
            color: white;
            border: 1px solid #333;
            border-radius: 7px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #5865f2;
        }

        .primary {
            margin-top: 20px;
            padding: 12px 18px;
            background: #5865f2;
            color: white;
            border-radius: 7px;
            font-weight: bold;
        }

        .primary:hover {
            background: #4752c4;
        }

        .secondary {
            padding: 9px 13px;
            background: #222;
            color: white;
            border-radius: 6px;
        }

        .danger {
            padding: 9px 13px;
            background: #b42323;
            color: white;
            border-radius: 6px;
        }

        .match {
            background: #0a0a0a;
            border: 1px solid #292929;
            border-radius: 10px;
            padding: 18px;
            margin-top: 12px;
        }

        .match-title {
            font-size: 17px;
            font-weight: bold;
        }

        .match-meta {
            color: #999;
            font-size: 13px;
            margin-top: 7px;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 9px;
            border-radius: 20px;
            background: #222;
            font-size: 11px;
        }

        .message {
            margin-top: 12px;
            font-size: 13px;
        }

        #adminPanel {
            display: none;
        }

        #loginPanel {
            max-width: 450px;
            margin: 80px auto;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px 12px;
            }

            .header {
                align-items: flex-start;
            }

            .logo {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LOGIN -->

    <div id="loginPanel" class="card">

        <h2>🏏 Cricketive Admin</h2>

        <p style="color:#999;font-size:13px;">
            Sign in to manage live cricket matches.
        </p>

        <label>Email</label>

        <input
            id="email"
            type="email"
            placeholder="Admin email"
        >

        <label>Password</label>

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

        <button
            class="primary"
            onclick="login()">
            LOGIN
        </button>

        <div
            id="loginMessage"
            class="message">
        </div>

    </div>


    <!-- ADMIN PANEL -->

    <div id="adminPanel">

        <div class="header">

            <div class="logo">
                CRICKETIVE 🏏
            </div>

            <button
                class="logout"
                onclick="logout()">
                LOGOUT
            </button>

        </div>


        <!-- ADD / EDIT MATCH -->

        <div class="card">

            <h2 id="formTitle">
                Add Match
            </h2>

            <input
                id="editId"
                type="hidden"
            >

            <label>Match Title</label>

            <input
                id="title"
                type="text"
                placeholder="India vs Sri Lanka"
            >


            <label>Team 1</label>

            <input
                id="team1"
                type="text"
                placeholder="India"
            >


            <label>Team 2</label>

            <input
                id="team2"
                type="text"
                placeholder="Sri Lanka"
            >


            <label>Competition</label>

            <input
                id="competition"
                type="text"
                placeholder="International Cricket"
            >


            <label>Match Time</label>

            <input
                id="match_time"
                type="text"
                placeholder="7:30 PM"
            >


            <label>Status</label>

            <select id="status">

                <option value="Upcoming">
                    Upcoming
                </option>

                <option value="Live">
                    Live
                </option>

                <option value="Finished">
                    Finished
                </option>

            </select>


            <label>Stream Embed URL</label>

            <input
                id="embed_url"
                type="url"
                placeholder="https://embed.st/..."
            >


            <button
                id="saveButton"
                class="primary"
                onclick="saveMatch()">
                ADD MATCH
            </button>

            <button
                id="cancelButton"
                class="secondary hidden"
                onclick="resetForm()"
                style="margin-left:8px;">
                CANCEL
            </button>

            <div
                id="formMessage"
                class="message">
            </div>

        </div>


        <!-- MATCH LIST -->

        <div class="card">

            <h2>Matches</h2>

            <div id="matches">
                Loading...
            </div>

        </div>

    </div>

</div>


<script>

    /*
     * ==========================================
     * SUPABASE CONFIGURATION
     * ==========================================
     */

    const SUPABASE_URL =
        "https://qkzwzdyahwzcwtqgcbud.supabase.co";

    const SUPABASE_ANON_KEY =
        "sb_publishable_wgba0C-XWm2B6UA-d93Rhw_9aWXKMVC";


    const client =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    /*
     * ==========================================
     * LOGIN
     * ==========================================
     */

    async function login() {

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("loginMessage");


        if (!email || !password) {

            message.textContent =
                "Enter your email and password.";

            return;
        }


        message.textContent = "Signing in...";


        const { data, error } =
            await client.auth.signInWithPassword({
                email: email,
                password: password
            });


        if (error) {

            message.textContent =
                error.message;

            return;
        }


        showAdmin();

    }


    /*
     * ==========================================
     * LOGOUT
     * ==========================================
     */

    async function logout() {

        await client.auth.signOut();

        document.getElementById("adminPanel")
            .style.display = "none";

        document.getElementById("loginPanel")
            .classList.remove("hidden");

    }


    /*
     * ==========================================
     * CHECK LOGIN
     * ==========================================
     */

    async function checkSession() {

        const { data } =
            await client.auth.getSession();


        if (data.session) {

            showAdmin();

        }

    }


    function showAdmin() {

        document.getElementById("loginPanel")
            .classList.add("hidden");

        document.getElementById("adminPanel")
            .style.display = "block";

        loadMatches();

    }


    /*
     * ==========================================
     * LOAD MATCHES
     * ==========================================
     */

    async function loadMatches() {

        const container =
            document.getElementById("matches");

        container.innerHTML = "Loading...";


        const { data, error } =
            await client
                .from("Matches")
                .select("*")
                .order("created_at", {
                    ascending: false
                });


        if (error) {

            container.innerHTML =
                `<p style="color:#ff6666;">
                    ${escapeHtml(error.message)}
                </p>`;

            return;
        }


        if (!data || data.length === 0) {

            container.innerHTML =
                `<p style="color:#888;">
                    No matches added yet.
                </p>`;

            return;
        }


        container.innerHTML = "";


        data.forEach(match => {

            const div =
                document.createElement("div");

            div.className = "match";


            div.innerHTML = `

                <div class="match-title">
                    ${escapeHtml(match.title)}
                </div>

                <div class="match-meta">

                    ${escapeHtml(match.team1)}
                    vs
                    ${escapeHtml(match.team2)}

                    <br>

                    ${escapeHtml(match.competition || "")}

                    <br>

                    ${escapeHtml(match.match_time || "")}

                </div>

                <span class="status">
                    ${escapeHtml(match.status)}
                </span>

                <div class="actions">

                    <button
                        class="secondary"
                        onclick='editMatch(${JSON.stringify(match)})'>
                        EDIT
                    </button>

                    <button
                        class="danger"
                        onclick="deleteMatch('${match.id}')">
                        DELETE
                    </button>

                </div>
            `;


            container.appendChild(div);

        });

    }


    /*
     * ==========================================
     * ADD / UPDATE MATCH
     * ==========================================
     */

    async function saveMatch() {

        const editId =
            document.getElementById("editId").value;


        const match = {

            title:
                document.getElementById("title").value.trim(),

            team1:
                document.getElementById("team1").value.trim(),

            team2:
                document.getElementById("team2").value.trim(),

            competition:
                document.getElementById("competition").value.trim(),

            match_time:
                document.getElementById("match_time").value.trim(),

            status:
                document.getElementById("status").value,

            embed_url:
                document.getElementById("embed_url").value.trim()

        };


        const message =
            document.getElementById("formMessage");


        if (
            !match.title ||
            !match.team1 ||
            !match.team2 ||
            !match.embed_url
        ) {

            message.textContent =
                "Fill in the title, teams and embed URL.";

            return;
        }


        message.textContent = "Saving...";


        let result;


        if (editId) {

            result =
                await client
                    .from("Matches")
                    .update(match)
                    .eq("id", editId);

        } else {

            result =
                await client
                    .from("Matches")
                    .insert([match]);

        }


        if (result.error) {

            message.textContent =
                result.error.message;

            return;
        }


        message.textContent =
            "Saved successfully!";


        resetForm();

        loadMatches();

    }


    /*
     * ==========================================
     * EDIT MATCH
     * ==========================================
     */

    function editMatch(match) {

        document.getElementById("editId").value =
            match.id;

        document.getElementById("title").value =
            match.title || "";

        document.getElementById("team1").value =
            match.team1 || "";

        document.getElementById("team2").value =
            match.team2 || "";

        document.getElementById("competition").value =
            match.competition || "";

        document.getElementById("match_time").value =
            match.match_time || "";

        document.getElementById("status").value =
            match.status || "Upcoming";

        document.getElementById("embed_url").value =
            match.embed_url || "";


        document.getElementById("formTitle")
            .textContent = "Edit Match";

        document.getElementById("saveButton")
            .textContent = "UPDATE MATCH";

        document.getElementById("cancelButton")
            .classList.remove("hidden");


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    /*
     * ==========================================
     * RESET FORM
     * ==========================================
     */

    function resetForm() {

        document.getElementById("editId").value = "";

        document.getElementById("title").value = "";

        document.getElementById("team1").value = "";

        document.getElementById("team2").value = "";

        document.getElementById("competition").value = "";

        document.getElementById("match_time").value = "";

        document.getElementById("status").value =
            "Upcoming";

        document.getElementById("embed_url").value = "";


        document.getElementById("formTitle")
            .textContent = "Add Match";

        document.getElementById("saveButton")
            .textContent = "ADD MATCH";

        document.getElementById("cancelButton")
            .classList.add("hidden");

        document.getElementById("formMessage")
            .textContent = "";

    }


    /*
     * ==========================================
     * DELETE MATCH
     * ==========================================
     */

    async function deleteMatch(id) {

        if (!confirm(
            "Are you sure you want to delete this match?"
        )) {
            return;
        }


        const { error } =
            await client
                .from("Matches")
                .delete()
                .eq("id", id);


        if (error) {

            alert(error.message);

            return;
        }


        loadMatches();

    }


    /*
     * ==========================================
     * BASIC HTML ESCAPING
     * ==========================================
     */

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /*
     * ==========================================
     * START
     * ==========================================
     */

    checkSession();

</script>

</body>
</html>
